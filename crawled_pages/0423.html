 Irvine men's basketball program, head coach <dfn><a href="/sports/mens-basketball/roster/coaches/russell-turner/1143" rel="smarttag" rev="1143">Russell Turner</a></dfn> announced Thursday.<br>
<br>
"We are excited to welcome Olivier Rioux to our program," Turner said. "Olivier is a high-character young man whose presence will elevate our team, our university, and our community. He embodies the values that have defined our success at UC Irvine.<br>
<br>
We've built a strong relationship with Olivier and his family over the years, dating back to his high school recruitment, and that familiarity gives us tremendous belief in who he is both on and off the court. Olivier's unique skill set and physical presence align perfectly with the tradition of dominant front court players in our program. We believe he will have an immediate impact and continue to grow within our system, and we are thrilled to have him join the Anteater family."<br>
<br>
Rioux became the tallest player in college basketball history in his collegiate debut against North Florida last season. In 2025-26, he was a member of the Florida team that ended the season 27-8 overall with a No. 9 ranking. He saw action in 11 games, recording seven points and six rebounds, including a dunk and two rebounds in the Gators' NCAA Tournament game versus Prairie View A&M. Rioux was a redshirt on Florida's 2025 national championship team.<br>
<br>
Prior to Florida, he competed at the IMG Academy in Florida. The Terrebonne, Quebec, Canada native has been a member of Canada's national team, participating in the 2025 U19 World Cup, 2024 U18 AmeriCup, 2023 U19 World Cup, the 2022 U17 World Cup and the 2021 U16 Americas Championship.<br>
<br>
He holds the Guinness World Record for tallest teenager, growing to over 7-0 the summer before entering seventh grade.<br>
<br>
UC Irvine boasted the tallest starting lineup in college basketball on December 18, 2015 anchored by 7-6 center Mamadou Ndiaye.<br>
<br>
UCI is coming off their 10<sup>th</sup> Big West regular season title, ending the year 23-12 overall. One of the most dominant defensive teams in the country, ended the year ranked fifth in blocks (5.8) and field goal percentage defense (38.8), eighth in defensive rebounds (28.66) and 13th in rebounds per game (40.29).<br>

,"short_title":4,"url":4},"365","anteater365",41,"anteater-365","Anteater365",{"abbreviation":439,"facebook":4,"gender":4,"global_sport_id":4,"global_sport_shortname":22,"global_sport_name_slug":440,"id":441,"instagram":4,"non_sport":12,"pinterest":4,"shortname":440,"title":442,"tickets":4,"twitter":4,"youtube":4,"rosterId":443,"scheduleId":444,"displayOpponentHistory":122,"short_title":4,"url":4},"OLY","olympics",42,"Olympics",201,377,{"stories":446,"isLoadingMore":447,"isLoading":448,"moreToLoad":449,"storyContent":450,"storyGames":471,"isLoadingStoryGames":122,"storyGameLeaders":472,"isLoadingStoryGameLeaders":122,"storyGamesTeamsStats":474,"isLoadingStoryGamesTeamsStats":476,"isStoryContentUnsafeHtml":477,"storyNextGame":478,"isLoadingStoryNextGame":122,"storyContentLoading":479,"nextStory":480,"storySettings":481,"defaultSportTemplate":145,"preloadedTemplates":486},{},{},{},{},{"7443671544812954":451},{"applyStandardFormatting":12,"blocks":4,"isBlockBased":122,"contentId":452,"contentTitle":115,"contentDate":453,"contentUrl":454,"contentImageUrl":455,"content":456,"contentTemplate":145,"id":457,"title":115,"titleInRotator":12,"subHeadline":22,"teaser":116,"type":22,"byline":458,"appExclusive":122,"date":453,"sportDisplay":188,"sport":459,"sportShortname":185,"primaryImage":462,"imageSource":455,"imageFocalPoint":4,"imageAltText":119,"imageCaption":22,"video":463,"url":454,"redirectAbsoluteUrl":22,"links":465,"homepageFeedTemplate":22,"games":466,"galleryId":368,"galleryImages":467,"writer":4,"players":468,"globalSportMapName":469,"storyMetaDescription":4,"storyMetaOgDescription":4,"storyMetaKeywords":4,"storyMetaOgTitle":4,"imageCreditText":4,"alternateImage":4,"insideContentImage":4,"formattedDate":470,"gamePostStoryId":4,"isMediaOnStoryPage":12},"20360","2026-04-30T00:01:00","/news/2026/4/30/mens-basketball-uc-irvine-mens-basketball-signs-7-9-olivier-rioux","/images/2026/4/29/Signed_MBB_Rotator_-_Oliver_Rioux.jpg","IRVINE, Calif. – Florida transfer Olivier Rioux, who stands at 7-9, has signed with the UC Irvine men's basketball program, head coach \u003Cdfn>\u003Ca href=\"/sports/mens-basketball/roster/coaches/russell-turner/1143\" rel=\"smarttag\" rev=\"1143\">Russell Turner\u003C/a>\u003C/dfn> announced Thursday.\u003Cbr>\r\n\u003Cbr>\r\n\"We are excited to welcome Olivier Rioux to our program,\" Turner said. \"Olivier is a high-character young man whose presence will elevate our team, our university, and our community. He embodies the values that have defined our success at UC Irvine.\u003Cbr>\r\n\u003Cbr>\r\nWe've built a strong relationship with Olivier and his family over the years, dating back to his high school recruitment, and that familiarity gives us tremendous belief in who he is both on and off the court. Olivier's unique skill set and physical presence align perfectly with the tradition of dominant front court players in our program. We believe he will have an immediate impact and continue to grow within our system, and we are thrilled to have him join the Anteater family.\"\u003Cbr>\r\n\u003Cbr>\r\nRioux became the tallest player in college basketball history in his collegiate debut against North Florida last season. In 2025-26, he was a member of the Florida team that ended the season 27-8 overall with a No. 9 ranking. He saw action in 11 games, recording seven points and six rebounds, including a dunk and two rebounds in the Gators' NCAA Tournament game versus Prairie View A&M. Rioux was a redshirt on Florida's 2025 national championship team.\u003Cbr>\r\n\u003Cbr>\r\nPrior to Florida, he competed at the IMG Academy in Florida. The Terrebonne, Quebec, Canada native has been a member of Canada's national team, participating in the 2025 U19 World Cup, 2024 U18 AmeriCup, 2023 U19 World Cup, the 2022 U17 World Cup and the 2021 U16 Americas Championship.\u003Cbr>\r\n\u003Cbr>\r\nHe holds the Guinness World Record for tallest teenager, growing to over 7-0 the summer before entering seventh grade.\u003Cbr>\r\n\u003Cbr>\r\nUC Irvine boasted the tallest starting lineup in college basketball on December 18, 2015 anchored by 7-6 center Mamadou Ndiaye.\u003Cbr>\r\n\u003Cbr>\r\nUCI is coming off their 10\u003Csup>th\u003C/sup> Big West regular season title, ending the year 23-12 overall. One of the most dominant defensive teams in the country, ended the year ranked fifth in blocks (5.8) and field goal percentage defense (38.8), eighth in defensive rebounds (28.66) and 13th in rebounds per game (40.29).\u003Cbr>\r\n ",20360,"Stacey Shackleford",{"id":184,"title":188,"abbreviation":182,"shortTitle":182,"shortname":185,"facebook":183,"twitter":187,"gender":161,"pinterest":22,"instagram":187,"youtube":22,"globalSportShortname":185,"globalSportNameSlug":186,"tickets":189,"youtubePlaylistId":460,"globalSportId":184,"nonSport":122,"showAtVs":12,"gameSynonym":461},"PLfmn2nNyi07jl1ravr1pZvAeTOyD2iMAB","Games",{"caption":22,"creditText":4,"focalPoint":4,"url":455,"absoluteUrl":455,"altText":119,"title":4,"creditName":4},{"youtube":4,"archive":4,"metadata":464},{"title":4,"thumbnail":4},[],[],[],[],"basketball"," April 30, 2026",{},{"658602137931201":473},[],{"4096115633983":475},[],{"4096115633983":122},{},{"2585546609884265":4},{"7443671544812954":122},{"storyId":457,"sportId":184},{"defaultTemplate":145,"endlessScrollIsEnabled":122,"featuredTemplatesCustomization":482,"customCss":22},{"logoImage":483,"headerBackgroundColor":484,"hidePreviousPage":122,"featuredTemplate1":485},{"mediaCaption":4,"url":-1,"absoluteUrl":-1,"altText":-1,"title":-1,"creditName":4},"#002144",{"hideRelatedStories":12,"hidePostDate":122},{"/news/2026/4/27/mens-basketball-record-setting-performances-highlight-another-successful-season":487,"/news/2026/4/8/mens-basketball-assistant-coach-julius-smith-recognized-as-nxt-up-rising-stars":488,"/news/2026/3/24/mens-basketball-saran-carrington-named-csc-academic-all-district":490,"/news/2026/3/17/mens-basketball-secnd-half-rally-falls-short-in-75-72-nit-loss-to-unlv":4
