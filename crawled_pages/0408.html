dth":6892,"height":6893,"aspect_ratio":6885},"https://i.ytimg.com/vi/ODEDK0gC770/maxresdefault.jpg",1280,720,{"alt_text":15,"url":6895,"width":6896,"height":6888,"aspect_ratio":6881},"https://i.ytimg.com/vi/ODEDK0gC770/sddefault.jpg",640,{"youtube":6898,"title":6899,"component":6900},"https://youtube.com/watch?v=ODEDK0gC770","A UCI Giving Day 2026 Message from Athletics","youtube",{"channel":6902,"date":6874,"description":6904,"id":6905,"images":6906,"showcase":6917,"title":6919,"likes":362,"views":362,"favorites":362,"duration":21},{"description":15,"id":6871,"image":6903,"subscribers":362,"title":6873,"videos":362,"views":362},{"alt_text":15,"url":21},"With UC Irvine’s approval to name the pool at Anteater Aquatics Complex in honor of the late and legendary Ted Newland, UCI Water Polo has launched a fundraising campaign to make the tribute a lasting reality.\n\nOver a remarkable 39-year career at UC Irvine, Coach Newland built one of the most respected programs in collegiate men’s water polo. Under his leadership, the Anteaters made 21 NCAA Championship appearances and captured three national titles in 1970, 1982, and 1989. Among his most celebrated achievements was leading the team to a perfect 30-0 season in 1982. \n\nNewland became the first NCAA water polo coach to reach 700 career victories, finishing with an overall record of 714-345-5. He was a four-time National Coach of the Year and a nine-time conference coach of the year. Beyond his records and accolades, Coach Newland shaped generations of student-athletes by instilling an enduring standard of excellence and character both in and out of the pool.\n\nThe broader fundraising initiative totals $175,000, encompassing both the endowment and dedication-related expenses. The endowment will be seeded with the funds raised after covering those dedication costs and will continue to grow over time, ensuring the long-term sustainability of UC Irvine Water Polo for generations to come.\n\nFor more information about how to contribute to the Ted Newland endowment and pool naming project, please contact UC Irvine Executive Director of Athletics Development Brandon Leimbach at leimbach@uci.edu.\n\nThanks for watching and supporting UCI Athletics! Rip 'Em!\r\nFollow the 'Eaters! \r\n\r\nucirvinesports.com\r\n@uciathletics  \n@uciwwp  \n@ucimwpolo","e1MMIm64ELw",{"default":6907,"medium":6909,"high":6911,"maxres":6913,"standard":6915},{"alt_text":15,"url":6908,"width":1179,"height":6880,"aspect_ratio":6881},"https://i.ytimg.com/vi/e1MMIm64ELw/default.jpg",{"alt_text":15,"url":6910,"width":251,"height":6884,"aspect_ratio":6885},"https://i.ytimg.com/vi/e1MMIm64ELw/mqdefault.jpg",{"alt_text":15,"url":6912,"width":6888,"height":6889,"aspect_ratio":6881},"https://i.ytimg.com/vi/e1MMIm64ELw/hqdefault.jpg",{"alt_text":15,"url":6914,"width":6892,"height":6893,"aspect_ratio":6885},"https://i.ytimg.com/vi/e1MMIm64ELw/maxresdefault.jpg",{"alt_text":15,"url":6916,"width":6896,"height":6888,"aspect_ratio":6881},"https://i.ytimg.com/vi/e1MMIm64ELw/sddefault.jpg",{"youtube":6918,"title":6919,"component":6900},"https://youtube.com/watch?v=e1MMIm64ELw","UC Irvine Water Polo | Ted Newland Endowment & Pool Naming Project",{"channel":6921,"date":6874,"description":6923,"id":6924,"images":6925,"showcase":6936,"title":6938,"likes":362,"views":362,"favorites":362,"duration":21},{"description":15,"id":6871,"image":6922,"subscribers":362,"title":6873,"videos":362,"views":362},{"alt_text":15,"url":21},"Welcome to Anteater Spotlights! Tune in as Mya Romero sits down with Men's Tennis student-athlete Max Fardanesh to learn more about life at UC Irvine, his tennis journey, and more!\n\nFor more content and information, follow us on our website or at the social handles below!\n\nucirvinesports.com\n@uciathletics\n@ucimten","8u3Yybd5VVc",{"default":6926,"medium":6928,"high":6930,"maxres":6932,"standard":6934},{"alt_text":15,"url":6927,"width":1179,"height":6880,"aspect_ratio":6881},"https://i.ytimg.com/vi/8u3Yybd
