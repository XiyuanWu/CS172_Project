="" class="s-icon s-icon-social-facebook s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-facebook"></use></svg></a><a data-test-id="s-share__pinterest-link" href="https://pinterest.com/pin/create/button/?url=&amp;media=%2Fimages%2F2026%2F5%2F3%2FUCLA0612.jpg" target="_blank" class="s-share-item s-share-item__pinterest flex w-full items-center justify-center text-center text-[18px] last:border-0 border-r" aria-label="Share via Pinterest, opens in new tab"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-social-pinterest s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-pinterest"></use></svg></a><a data-test-id="s-share__linkedin-link" href="https://www.linkedin.com/sharing/share-offsite/?url=" target="_blank" class="s-share-item s-share-item__linkedin flex w-full items-center justify-center text-center text-[18px] last:border-0 border-r" aria-label="Share via Linked-in, opens in new tab"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-social-linkedin s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-linkedin"></use></svg></a></div></div><!----><!----><!----></div><div class="flex pt-[32px]"><!----><div id="storyContainer" class="relative w-full print:static"><!--[--><span></span><!----><div id="storyPageContentBody" data-safe-html="true" class="prose story-page__content__body s-text-paragraph-longform text-theme-safe min-h-[200px] max-w-none"><strong>EAST LANSING, Mich. – </strong>The No. 1-ranked UCLA baseball team erased an eight-run deficit over the final three innings to stun Michigan State, 13-11, and complete a three-game sweep on Sunday afternoon at Jeff Ishbia Field.<br>
 <br>
With the win, the Bruins (43-4, 24-0 Big Ten) clinch a share of the Big Ten Conference title and remain unbeaten in league play. UCLA has now secured at least a share of the regular-season crown in each of its first two years in the conference.<br>
 <br>
The comeback is UCLA's largest since the 2022 Pac-12 Tournament, when the Bruins rallied from nine runs down to defeat Oregon State.<br>
 <br>
Trailing 10-2 after six innings in the books, UCLA mounted a six-run rally in the seventh to pull within two. A hit-by-pitch and three straight walks forced in the first run, and <dfn><a href="/sports/baseball/roster/mulivai-levu/15534" rel="smarttag" rev="15534">Mulivai Levu</a></dfn> added another with an RBI groundout. <dfn><a href="/sports/baseball/roster/payton-brennan/15521" rel="smarttag" rev="15521">Payton Brennan</a></dfn> then bounced a ball over the first baseman and into the right-field corner to plate two more. <dfn><a href="/sports/baseball/roster/will-gasparino/15558" rel="smarttag" rev="15558">Will Gasparino</a></dfn> followed with a high fly ball that dropped in shallow right, turning into a two-run double to cap the six-run inning.<br>
 <br>
UCLA drew level in the eighth with a three-run surge that erased what had been an eight-run deficit. West jump-started the inning with a triple to center, and <dfn><a href="/sports/baseball/roster/roch-cholowsky/15523" rel="smarttag" rev="15523">Roch Cholowsky</a></dfn> reached on an error to bring home the first run. Levu followed with a walk, and <dfn><a href="/sports/baseball/roster/roman-martin/15535" rel="smarttag" rev="15535">Roman Martin</a></dfn> ripped a double over the left fielder's head to pull the Bruins within one. Brennan then lifted a sacrifice fly to tie the game at 11-11.<br>
 <br>
UCLA completed the comeback with two more runs in the ninth. <dfn><a href="/sports/baseball/roster/aiden-aguayo/15554" rel="smarttag" rev="15554">Aiden Aguayo</a></dfn> led off with a single, and <dfn><a href="/sports/baseball/roster/dean-west/15543" rel="smarttag" rev="15543">Dean West</a></dfn> followed with a walk to put two aboard. Cholowsky then delivered the biggest swing of the day, ripping a line drive to left to score the go-ahead run. Levu added insurance moments later, shooting a base hit up the middle to bring home Cholowsky and extend the lead to two.<br>
 <br>
<dfn><a href="/sports/baseball/roster/easton-hawk/15528" rel="smarttag" rev="15528">Easton Hawk</a></dfn> locked it down in the ninth to secure his third save in as many days, giving him 12 on the season. It marks the second time this year he has recorded a save in all three games of a weekend series, previously accomplishing the feat against Minnesota from April 17-19.<br>
 <br>
Levu powered the offense with a solo homer as part of a 3-for-5, three-RBI day. Cholowsky, Martin, and Brennan each added two hits, while Gasparino, Dugger, and Aguayo chipped in one apiece.<br>
 <br>
UCLA took the lead in its first turn at the plate when Levu launched a solo shot over the center field wall for his 14<sup>th</sup> homer of the year and second of the series.<br>
 <br>
The Spartans answered with three runs in the bottom half, highlighted by a two-run homer from Parker Picot.<br>
 <br>
UCLA got one back in the second after Brennan and Gasparino worked back-to-back walks, and Aguayo brought a run home with an RBI groundout.<br>
 <br>
The Spartans rebuilt their two-run lead in the third, but Stump punched back with two strikeouts, and Gasparino capped the frame with a highlight-reel diving catch to leave two runners in scoring position.<br>
 <br>
The Spartans pushed the margin to four in the fourth, piecing together three straight two-out hits to produce a two-run frame. Picot added to the Spartans' lead in the fifth, blasting his second homer of the contest to spark another two-run inning and extend the lead to six. In the sixth, Michigan State tacked on two more to make it an eight-run lead.<br>
 <br>
From there, UCLA mounted its impressive comeback while <dfn><a href="/sports/baseball/roster/zach-strickland/15551" rel="smarttag" rev="15551">Zach Strickland</a></dfn> (5-1) and Hawk slammed the door, each tossing a scoreless frame to preserve the lead.<br>
 <br>
The Bruins will travel to Loyola Marymount for a midweek contest on Tuesday, May 5 at 6 p.m. PT. Live coverage will be available on ESPN+.</div><!----><!--]--><div class="c-story-page__custom-ad flex justify-center pt-4 empty:hidden"><!--[--><!----><!--]--></div><!----></div></div><span></span></div></div></div><!--]--></div><div class="lg:sidearm-rail w-full flex-none shrink-0 lg:min-w-[var(--sidearm-rail)]" data-test-id="right-rail-template__slot-rail"><div class="h-full lg:min-h-[300px]"><!--[--><div class="mt-[16px] flex h-full flex-col gap-4 print:hidden lg:mt-0" data-v-52ed4720><!----><!----><div class="s-stories-module s-stories-module--theme-light-theme s-stories-module--wrapper s-stories-module__template-mobile--top s-stories-module__template-tablet--top s-stories-module__template-desktop-full--top s-stories-module__template-desktop-rail--left s-stories-module__template-desktop-no-rail--top lg:shadow-level-1 min-h-[203vw] sm:min-h-[56vw] md:min-h-[43vw] lg:min-h-[37vw] xl:min-h-[478px] !border-theme-border order-1 m-0 !border !border-solid" data-test-id="s-stories__root" data-v-52ed4720 data-v-9b89d9fe><div class="s-stories-module__wrapper" data-v-9b89d9fe><div data-test-id="s-stories" class="s-stories-module__heading" data-v-9b89d9fe><div data-test-id="s-heading__root" class="s-heading inline-flex flex-col s-heading--theme-light-theme s-heading--size-regular s-heading--device-desktop s-heading--border-position-under s-heading--border-sponsor-call-to-action w-full" innerbackground="false" data-v-9b89d9fe><div class="s-heading-inner inline-flex flex-wrap items-center justify-start border-b"><h3 name="h3" class="s-heading__main-text inline-flex items-center text-left s-text-heading self-end border-b-[4px] pb-[8px]"><!----><!----><div class="s-list-item__left-slot"><!--[--><!--]--></div> Related News</h3><div class="s-heading__sponsored-by-wrapper flex items-center ml-[16px]"><!--[--><div style="" class="s-advert sidearm-ad-state flex flex-row justify-center" nterest":4,"shortname":481,"title":480,"tickets":4,"twitter":4,"youtube":4,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":125,"short_title":4,"url":4},"Young Alumni","young_alumni","young-alumni",61,{"abbreviation":485,"facebook":4,"gender":4,"global_sport_id":4,"global_sport_shortname":486,"global_sport_name_slug":487,"id":488,"instagram":4,"non_sport":12,"pinterest":4,"shortname":486,"title":485,"tickets":4,"twitter":4,"youtube":4,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":125,"short_title":4,"url":4},"Alumni Association","alumni_association","alumni-association",62,{"abbreviation":490,"facebook":4,"gender":4,"global_sport_id":4,"global_sport_shortname":491,"global_sport_name_slug":492,"id":493,"instagram":494,"non_sport":12,"pinterest":4,"shortname":491,"title":495,"tickets":4,"twitter":496,"youtube":4,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":125,"short_title":4,"url":4},"BVC","bvc","bruin-varsity-club",63,"bruinvarsityclub","Bruin Varsity Club","UCLAVarsityClub",{"stories":498,"isLoadingMore":499,"isLoading":500,"moreToLoad":501,"storyContent":502,"storyGames":679,"isLoadingStoryGames":125,"storyGameLeaders":680,"isLoadingStoryGameLeaders":125,"storyGamesTeamsStats":895,"isLoadingStoryGamesTeamsStats":1013,"isStoryContentUnsafeHtml":1014,"storyNextGame":1015,"isLoadingStoryNextGame":125,"storyContentLoading":1051,"nextStory":1052,"storySettings":1053,"defaultSportTemplate":152,"preloadedTemplates":1061},{},{},{},{},{"2328411739799646":503},{"applyStandardFormatting":12,"blocks":4,"isBlockBased":125,"contentId":504,"contentTitle":115,"contentDate":505,"contentUrl":13,"contentImageUrl":506,"content":507,"contentTemplate":152,"id":508,"title":115,"titleInRotator":12,"subHeadline":22,"teaser":116,"type":509,"byline":22,"appExclusive":125,"date":505,"sportDisplay":174,"sport":510,"sportShortname":172,"primaryImage":513,"imageSource":506,"imageFocalPoint":4,"imageAltText":119,"imageCaption":119,"video":515,"url":13,"redirectAbsoluteUrl":22,"links":520,"homepageFeedTemplate":22,"games":534,"galleryId":600,"galleryImages":601,"writer":4,"players":602,"globalSportMapName":172,"storyMetaDescription":4,"storyMetaOgDescription":4,"storyMetaKeywords":4,"storyMetaOgTitle":4,"imageCreditText":514,"alternateImage":4,"insideContentImage":4,"formattedDate":678,"gamePostStoryId":4,"isMediaOnStoryPage":12},"70510","2026-05-03T13:59:00","/images/2026/5/3/UCLA0612.jpg","\u003Cstrong>EAST LANSING, Mich. – \u003C/strong>The No. 1-ranked UCLA baseball team erased an eight-run deficit over the final three innings to stun Michigan State, 13-11, and complete a three-game sweep on Sunday afternoon at Jeff Ishbia Field.\u003Cbr>\r\n \u003Cbr>\r\nWith the win, the Bruins (43-4, 24-0 Big Ten) clinch a share of the Big Ten Conference title and remain unbeaten in league play. UCLA has now secured at least a share of the regular-season crown in each of its first two years in the conference.\u003Cbr>\r\n \u003Cbr>\r\nThe comeback is UCLA's largest since the 2022 Pac-12 Tournament, when the Bruins rallied from nine runs down to defeat Oregon State.\u003Cbr>\r\n \u003Cbr>\r\nTrailing 10-2 after six innings in the books, UCLA mounted a six-run rally in the seventh to pull within two. A hit-by-pitch and three straight walks forced in the first run, and \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/mulivai-levu/15534\" rel=\"smarttag\" rev=\"15534\">Mulivai Levu\u003C/a>\u003C/dfn> added another with an RBI groundout. \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/payton-brennan/15521\" rel=\"smarttag\" rev=\"15521\">Payton Brennan\u003C/a>\u003C/dfn> then bounced a ball over the first baseman and into the right-field corner to plate two more. \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/will-gasparino/15558\" rel=\"smarttag\" rev=\"15558\">Will Gasparino\u003C/a>\u003C/dfn> followed with a high fly ball that dropped in shallow right, turning into a two-run double to cap the six-run inning.\u003Cbr>\r\n \u003Cbr>\r\nUCLA drew level in the eighth with a three-run surge that erased what had been an eight-run deficit. West jump-started the inning with a triple to center, and \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/roch-cholowsky/15523\" rel=\"smarttag\" rev=\"15523\">Roch Cholowsky\u003C/a>\u003C/dfn> reached on an error to bring home the first run. Levu followed with a walk, and \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/roman-martin/15535\" rel=\"smarttag\" rev=\"15535\">Roman Martin\u003C/a>\u003C/dfn> ripped a double over the left fielder's head to pull the Bruins within one. Brennan then lifted a sacrifice fly to tie the game at 11-11.\u003Cbr>\r\n \u003Cbr>\r\nUCLA completed the comeback with two more runs in the ninth. \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/aiden-aguayo/15554\" rel=\"smarttag\" rev=\"15554\">Aiden Aguayo\u003C/a>\u003C/dfn> led off with a single, and \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/dean-west/15543\" rel=\"smarttag\" rev=\"15543\">Dean West\u003C/a>\u003C/dfn> followed with a walk to put two aboard. Cholowsky then delivered the biggest swing of the day, ripping a line drive to left to score the go-ahead run. Levu added insurance moments later, shooting a base hit up the middle to bring home Cholowsky and extend the lead to two.\u003Cbr>\r\n \u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"/sports/baseball/roster/easton-hawk/15528\" rel=\"smarttag\" rev=\"15528\">Easton Hawk\u003C/a>\u003C/dfn> locked it down in the ninth to secure his third save in as many days, giving him 12 on the season. It marks the second time this year he has recorded a save in all three games of a weekend series, previously accomplishing the feat against Minnesota from April 17-19.\u003Cbr>\r\n \u003Cbr>\r\nLevu powered the offense with a solo homer as part of a 3-for-5, three-RBI day. Cholowsky, Martin, and Brennan each added two hits, while Gasparino, Dugger, and Aguayo chipped in one apiece.\u003Cbr>\r\n \u003Cbr>\r\nUCLA took the lead in its first turn at the plate when Levu launched a solo shot over the center field wall for his 14\u003Csup>th\u003C/sup> homer of the year and second of the series.\u003Cbr>\r\n \u003Cbr>\r\nThe Spartans answered with three runs in the bottom half, highlighted by a two-run homer from Parker Picot.\u003Cbr>\r\n \u003Cbr>\r\nUCLA got one back in the second after Brennan and Gasparino worked back-to-back walks, and Aguayo brought a run home with an RBI groundout.\u003Cbr>\r\n \u003Cbr>\r\nThe Spartans rebuilt their two-run lead in the third, but Stump punched back with two strikeouts, and Gasparino capped the frame with a highlight-reel diving catch to leave two runners in scoring position.\u003Cbr>\r\n \u003Cbr>\r\nThe Spartans pushed the margin to four in the fourth, piecing together three straight two-out hits to produce a two-run frame. Picot added to the Spartans' lead in the fifth, blasting his second homer of the contest to spark another two-run inning and extend the lead to six. In the sixth, Michigan State tacked on two more to make it an eight-run lead.\u003Cbr>\r\n \u003Cbr>\r\nFrom there, UCLA mounted its impressive comeback while \u003Cdfn>\u003Ca href=\"/sports/baseball/roster/zach-strickland/15551\" rel=\"smarttag\" rev=\"15551\">Zach Strickland\u003C/a>\u003C/dfn> (5-1) and Hawk slammed the door, each tossing a scoreless frame to preserve the lead.\u003Cbr>\r\n \u003Cbr>\r\nThe Bruins will travel to Loyola Marymount for a midweek contest on Tuesday, May 5 at 6 p.m. PT. Live coverage will be available on ESPN+.",70510,"postgame",{"id":171,"title":174,"abbreviation":168,"shortTitle":174,"shortname":172,"facebook":169,"twitter":176,"gender":170,"pinterest":22,"instagram":173,"youtube":22,"globalSportShortname":172,"globalSportNameSlug":172,"tickets":175,"youtubePlaylistId":511,"globalSportId":171,"nonSport":125,"showAtVs":12,"gameSynonym":512},"PLMrXynvCdGwf43C2ccCv9rGgxeyKEgH9r","Games",{"caption":119,"creditText":514,"focalPoint":4,"url":506,"absoluteUrl":506,"altText":1
