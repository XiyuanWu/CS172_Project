<br>
UCLA held set point 14-12 before the Anteaters rallied for the final four points, two on kills by <dfn><a href="/sports/mens-volleyball/roster/andreas-brinck/7629" rel="smarttag" rev="7629">Andreas Brinck</a></dfn> and two Bruin attack errors to capture the set and match, 16-14.<br>
<br>
UC Irvine improves to 20-8 overall and advances to the NCAA semifinals for the eighth time in program history.<br>
<br>
The Anteaters will face No. 4 seed Ball State who defeated Pepperdine, 3-2 in their regional next Saturday (May 9) at Pauley Pavilion. First serve is 3:30 p.m.<br>
<br>
Brinck hit .483 (17-3-29), putting down four of his team-best 17 kills in the fifth set. The outside hitter also recorded a career-high seven digs.<br>
<br>
Outside hitter <dfn><a href="/sports/mens-volleyball/roster/andrej-jokanovic/7630" rel="smarttag" rev="7630">Andrej Jokanovic</a></dfn> and middle blocker <dfn><a href="/sports/mens-volleyball/roster/trevor-clark/7628" rel="smarttag" rev="7628">Trevor Clark</a></dfn> followed with 14 kills each.  Jokanovic was one shy of a double-double with nine digs, while Clark added two block assists and an ace.<br>
<br>
Setter <dfn><a href="/sports/mens-volleyball/roster/cameron-kosty/7621" rel="smarttag" rev="7621">Cameron Kosty</a></dfn> had a team and career-high six total blocks (one solo) to go with 47 set assists, six digs, three kills and an ace.<br>
<br>
<strong>INSIDE THE NUMBERS</strong><br>
>Senior <dfn><a href="/sports/mens-volleyball/roster/william-d-arcy/7617" rel="smarttag" rev="7617">William D'Arcy</a></dfn> had five kills and six digs<br>
>Middle block er <dfn><a href="/sports/mens-volleyball/roster/micah-goss/7619" rel="smarttag" rev="7619">Micah Goss</a></dfn> fired three aces and recorded five kills and three block assists<br>
>Libero <dfn><a href="/sports/mens-volleyball/roster/shane-aitken/7613" rel="smarttag" rev="7613">Shane Aitken</a></dfn> posted 10 digs<br>
>The Anteaters out-aced the Bruins, 6-4<br>
>UCLA held the advantage in hitting (.388-.292), digs (48-39) and blocks (8-6)<br>
>UCLA's Sean Kelly had a match-high 26 kills in the loss<br>
>UCI hands UCLA its second loss of the season as the Bruins close 2026 with a 29-2 record.<br>
<br>
<strong>FIRST SET</strong><br>
>UCI made the first move with four in a row on a UCLA service error, block by <dfn><a href="/sports/mens-volleyball/roster/micah-goss/7619" rel="smarttag" rev="7619">Micah Goss</a></dfn> and <dfn><a href="/sports/mens-volleyball/roster/cameron-kosty/7621" rel="smarttag" rev="7621">Cameron Kosty</a></dfn>, a kill by <dfn><a href="/sports/mens-volleyball/roster/william-d-arcy/7617" rel="smarttag" rev="7617">William D'Arcy</a></dfn> down the line and a Bruin swing long, 9-6<br>
>An ace by Goss put the Anteater lead at 11-8<br>
>Kills by <dfn><a href="/sports/mens-volleyball/roster/trevor-clark/7628" rel="smarttag" rev="7628">Trevor Clark</a></dfn> and D'Arcy and two Bruin attack errors stretched the margin to 16-11<br>
>UCI led 17-12 on a crafty over the shoulder kill by <dfn><a href="/sports/mens-volleyball/roster/andreas-brinck/7629" rel="smarttag" rev="7629">Andreas Brinck</a></dfn> on two<br>
>Back-to-back blocks by the Bruins drew UCLA within 20-22<br>
>A kill by Clark put UCI at set point only to watch the Bruins rally with the next three, all kills, 23-24<br>
>A kill by Brinck ended the set 25-23<br>
<br>
<strong>SECOND SET</strong><br>
>UCI led 3-2 on a Bruin service error, block by Clark and Kosty and ace by Goss<br>
>A 4-1 run by the Bruins, all kills, moved UCLA in front 9-6<br>
>A kill by Goss inside the block,  an ace from D'Arcy and kills by Brinck and Jokanovic were part of a 4-1 UCI run to tie the set at 10-10<br>
>UCLA responded with the next four, 14-10<br>
>Three UCI errors, one courtesy of a block, started a 6-1 run by UCLA helped the Bruins to a 21-14 advantage<br>
>The Bruins would win the set 25-19, hitting .407 (13-2-27)<br>
>UCI hit just .037 (8-7-27)<br>
<br>
<strong>THIRD SET</strong><br>
>UCI started with an early 6-3 lead that included two Clark kills<br>
>Following a UCLA point, Brinck pounded back-to-back kills to force UCLA to call a timeout, 8-4<br>
>Kosty had a monster solo block to give the Anteaters an 11-7 lead<br>
>A kill by Jokanovic and an ace by Kosty made it 14-9<br>
>A pair of UCLA kills and a UCI attack that sailed long inched the Bruins within 15-16<br>
>Kosty hung in the air for an one-handed set for a Goss kill to stop the momentum, 17-15<br>
>Two Zach Rama kills knotted the set at 18 all then two from Sean Kelly pushed UCLA in front 20-19<br>
>A kill by Clark followed and the teams would go point for point until Brinck had a kill down the line from the left side then Kosty flew out of the back on two for a kill, 24-23<br>
>Following a Bruin timeout, Goss and Kosty clamped down the net for the block and set winner, 25-23<br>
>The Anteaters hit .556 (17-2-27)<br>
<br>
<strong>FOURTH SET</strong><br>
>UCLA held an early 5-2 lead<br>
>Three straight by UCI on two Bruin attack errors and an ace by Clark tied the set at 6-6<br>
>Three kills and a solo block gave UCLA a 16-11 lead<br>
>Consecutive kills by Jokanovic and Brinck made it 15-19 then Brink and Jokanovic again closed the gap to 17-20<br>
>UCLA would end the set with three of the last four points, 25-19<br>
<br>
<strong>FIFTH SET</strong><br>
>UCLA held a 4-3 lead with the help of three UCI service errors<br>
>Following a Brinck kill, the Bruins scored three unanswered to take an 8-4 lead<br>
>Anteaters wouldn't go away using two Bruins errors and a kill by Jokanovic and block by Kosty and Clark to force a UCLA timeout, 8-9<br>
>Out of the break, a Bruin attack error tied the set at 9-9<br>
> A Bruin service error and a kill by Brinck off the block moved UCI in front 12-11<br>
>UCLA scored the next three points on a block and two kills to get to set point 14-12<br>
>UCLA thought they had the match winner, but a challenge of a touch kept the set going and UCI took advantage on a Bruin attack error and a kill by Brinck, 15-14<br>
>The match winner was scored on a UCLA attack error, 16-14<br>
<br>
<strong>NOTES</strong><br>
>The Anteaters are battle-tested in five set matches this season, improving to 6-5 when going the distance<br>
>UCI snaps a 12 match losing streak against the Bruins<br>

bal_sport_shortname":4,"global_sport_name_slug":426,"id":427,"instagram":428,"non_sport":12,"pinterest":4,"shortname":426,"title":429,"tickets":4,"twitter":430,"youtube":431,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":12,"short_title":4,"url":4},"FEA","https://www.facebook.com/UCIAthletics/","features",40,"https://www.instagram.com/uciathletics/","Features","https://twitter.com/UCIAthletics","https://www.youtube.com/user/UCIrvineAthletics",{"abbreviation":433,"facebook":4,"gender":367,"global_sport_id":368,"global_sport_shortname":22,"global_sport_name_slug":434,"id":435,"instagram":4,"non_sport":12,"pinterest":4,"shortname":436,"title":437,"tickets":4,"twitter":4,"youtube":4,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":122,"short_title":4,"url":4},"365","anteater365",41,"anteater-365","Anteater365",{"abbreviation":439,"facebook":4,"gender":4,"global_sport_id":4,"global_sport_shortname":22,"global_sport_name_slug":440,"id":441,"instagram":4,"non_sport":12,"pinterest":4,"shortname":440,"title":442,"tickets":4,"twitter":4,"youtube":4,"rosterId":443,"scheduleId":444,"displayOpponentHistory":122,"short_title":4,"url":4},"OLY","olympics",42,"Olympics",201,377,{"stories":446,"isLoadingMore":447,"isLoading":448,"moreToLoad":449,"storyContent":450,"storyGames":592,"isLoadingStoryGames":122,"storyGameLeaders":593,"isLoadingStoryGameLeaders":122,"storyGamesTeamsStats":881,"isLoadingStoryGamesTeamsStats":919,"isStoryContentUnsafeHtml":920,"storyNextGame":921,"isLoadingStoryNextGame":122,"storyContentLoading":950,"nextStory":951,"storySettings":952,"defaultSportTemplate":145,"preloadedTemplates":957},{},{},{},{},{"7222224502748269":451},{"applyStandardFormatting":12,"blocks":4,"isBlockBased":122,"contentId":452,"contentTitle":115,"contentDate":453,"contentUrl":13,"contentImageUrl":454,"content":455,"contentTemplate":145,"id":456,"title":115,"titleInRotator":12,"subHeadline":22,"teaser":457,"type":458,"byline":459,"appExclusive":122,"date":453,"sportDisplay":254,"sport":460,"sportShortname":251,"primaryImage":463,"imageSource":454,"imageFocalPoint":4,"imageAltText":119,"imageCaption":22,"video":464,"url":13,"redirectAbsoluteUrl":22,"links":466,"homepageFeedTemplate":22,"games":467,"galleryId":368,"galleryImages":526,"writer":4,"players":527,"globalSportMapName":590,"storyMetaDescription":4,"storyMetaOgDescription":4,"storyMetaKeywords":4,"storyMetaOgTitle":4,"imageCreditText":4,"alternateImage":4,"insideContentImage":4,"formattedDate":591,"gamePostStoryId":4,"isMediaOnStoryPage":12},"20372","2026-05-02T20:02:00","/images/2026/5/2/RTH_7813.jpg","LOS ANGELES, Calif. -- No. 6 UC Irvine rallied in the fifth set to upset No. 1 UCLA 3-2 (25-23, 19-25, 25-23, 19-25, 16-14) to capture the Los Angeles Regional at Pauley Pavilion Saturday.\u003Cbr>\r\n\u003Cbr>\r\nUCLA held set point 14-12 before the Anteaters rallied for the final four points, two on kills by \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/andreas-brinck/7629\" rel=\"smarttag\" rev=\"7629\">Andreas Brinck\u003C/a>\u003C/dfn> and two Bruin attack errors to capture the set and match, 16-14.\u003Cbr>\r\n\u003Cbr>\r\nUC Irvine improves to 20-8 overall and advances to the NCAA semifinals for the eighth time in program history.\u003Cbr>\r\n\u003Cbr>\r\nThe Anteaters will face No. 4 seed Ball State who defeated Pepperdine, 3-2 in their regional next Saturday (May 9) at Pauley Pavilion. First serve is 3:30 p.m.\u003Cbr>\r\n\u003Cbr>\r\nBrinck hit .483 (17-3-29), putting down four of his team-best 17 kills in the fifth set. The outside hitter also recorded a career-high seven digs.\u003Cbr>\r\n\u003Cbr>\r\nOutside hitter \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/andrej-jokanovic/7630\" rel=\"smarttag\" rev=\"7630\">Andrej Jokanovic\u003C/a>\u003C/dfn> and middle blocker \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/trevor-clark/7628\" rel=\"smarttag\" rev=\"7628\">Trevor Clark\u003C/a>\u003C/dfn> followed with 14 kills each.  Jokanovic was one shy of a double-double with nine digs, while Clark added two block assists and an ace.\u003Cbr>\r\n\u003Cbr>\r\nSetter \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/cameron-kosty/7621\" rel=\"smarttag\" rev=\"7621\">Cameron Kosty\u003C/a>\u003C/dfn> had a team and career-high six total blocks (one solo) to go with 47 set assists, six digs, three kills and an ace.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>INSIDE THE NUMBERS\u003C/strong>\u003Cbr>\r\n>Senior \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/william-d-arcy/7617\" rel=\"smarttag\" rev=\"7617\">William D'Arcy\u003C/a>\u003C/dfn> had five kills and six digs\u003Cbr>\r\n>Middle block er \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/micah-goss/7619\" rel=\"smarttag\" rev=\"7619\">Micah Goss\u003C/a>\u003C/dfn> fired three aces and recorded five kills and three block assists\u003Cbr>\r\n>Libero \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/shane-aitken/7613\" rel=\"smarttag\" rev=\"7613\">Shane Aitken\u003C/a>\u003C/dfn> posted 10 digs\u003Cbr>\r\n>The Anteaters out-aced the Bruins, 6-4\u003Cbr>\r\n>UCLA held the advantage in hitting (.388-.292), digs (48-39) and blocks (8-6)\u003Cbr>\r\n>UCLA's Sean Kelly had a match-high 26 kills in the loss\u003Cbr>\r\n>UCI hands UCLA its second loss of the season as the Bruins close 2026 with a 29-2 record.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>FIRST SET\u003C/strong>\u003Cbr>\r\n>UCI made the first move with four in a row on a UCLA service error, block by \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/micah-goss/7619\" rel=\"smarttag\" rev=\"7619\">Micah Goss\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/cameron-kosty/7621\" rel=\"smarttag\" rev=\"7621\">Cameron Kosty\u003C/a>\u003C/dfn>, a kill by \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/william-d-arcy/7617\" rel=\"smarttag\" rev=\"7617\">William D'Arcy\u003C/a>\u003C/dfn> down the line and a Bruin swing long, 9-6\u003Cbr>\r\n>An ace by Goss put the Anteater lead at 11-8\u003Cbr>\r\n>Kills by \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/trevor-clark/7628\" rel=\"smarttag\" rev=\"7628\">Trevor Clark\u003C/a>\u003C/dfn> and D'Arcy and two Bruin attack errors stretched the margin to 16-11\u003Cbr>\r\n>UCI led 17-12 on a crafty over the shoulder kill by \u003Cdfn>\u003Ca href=\"/sports/mens-volleyball/roster/andreas-brinck/7629\" rel=\"smarttag\" rev=\"7629\">Andreas Brinck\u003C/a>\u003C/dfn> on two\u003Cbr>\r\n>Back-to-back blocks by the Bruins drew UCLA within 20-22\u003Cbr>\r\n>A kill by Clark put UCI at set point only to watch the Bruins rally with the next three, all kills, 23-24\u003Cbr>\r\n>A kill by Brinck ended the set 25-23\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>SECOND SET\u003C/strong>\u003Cbr>\r\n>UCI led 3-2 on a Bruin service error, block by Clark and Kosty and ace by Goss\u003Cbr>\r\n>A 4-1 run by the Bruins, all kills, moved UCLA in front 9-6\u003Cbr>\r\n>A kill by Goss inside the block,  an ace from D'Arcy and kills by Brinck and Jokanovic were part of a 4-1 UCI run to tie the set at 10-10\u003Cbr>\r\n>UCLA responded with the next four, 14-10\u003Cbr>\r\n>Three UCI errors, one courtesy of a block, started a 6-1 run by UCLA helped the Bruins to a 21-14 advantage\u003Cbr>\r\n>The Bruins would win the set 25-19, hitting .407 (13-2-27)\u003Cbr>\r\n>UCI hit just .037 (8-7-27)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>THIRD SET\u003C/strong>\u003Cbr>\r\n>UCI started with an early 6-3 lead that included two Clark kills\u003Cbr>\r\n>Following a UCLA point, Brinck pounded back-to-back kills to force UCLA to call a timeout, 8-4\u003Cbr>\r\n>Kosty had a monster solo block to give the Anteaters an 11-7 lead\u003Cbr>\r\n>A kill by Jokanovic and an ace by Kosty made it 14-9\u003Cbr>\r\n>A pair of UCLA kills and a UCI attack that sailed long inched the Bruins within 15-16\u003Cbr>\r\n>Kosty hung in the air for an one-handed set for a Goss kill to stop the momentum, 17-15\u003Cbr>\r\n>Two Zach Rama kills knotted the set at 18 all then two from Sean Kelly pushed UCLA in front 20-19\u003Cbr>\r\n>A kill by Clark followed and the teams would go point for point until Brinck had a kill down the line from the left side then Kosty flew out of the back on two for a kill, 24-23\u003Cbr>\r\n>Following a Bruin timeout, Goss and Kosty clamped down the net for the block and set winner, 25-23\u003Cbr>\r\n>The Anteaters hit .556 (17-2-27)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>FOURTH SET\u003C/strong>\u003Cbr>\r\n>UCLA held an early 5-2 lead\u003Cbr>\r\n>Three straight by UCI on two Bruin attack errors and an ace by Clark tied the set at 6-6\u003Cbr>\r\n>Three kills and a solo block gave UCLA a 16-11 lead\u003Cbr>\r\n>Consecutive kills by Jokanovic and Brinck made it 15-19 then Brink and Jokanovic again closed the gap to 17-20\u003Cbr>\r\n>UCLA would end the set with three of the last four points, 25-19\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>FIFTH SET\u003C/strong>\u003Cbr>\r\n>UCLA held a 4-3 lead with the help of three UCI service errors\u003Cbr>\r\n>Following a Brinck kill, the Bruins scored three unanswered to take an 8-4 lead\u003Cbr>\r\n>Anteaters wouldn't go away using two Bruins errors and a kill by Jokanovic and block by Kosty and Clark to force a UCLA timeout, 8-9\u003Cbr>\r\n>Out of the break, a Bruin attack error tied the set at 9-9\u003Cbr>\r\n> A Bruin service error and a kill by Brinck off the block moved UCI in front 12-11\u003Cbr>\r\n>UCLA scored the next three points on a block and two kills to get to set point 14-12\u003Cbr>\r\n>UCLA thought they had the match winner, but a challenge of a touch kept the set going and UCI took advantage on a Bruin attack error and a kill by Brinck, 15-14\u003Cbr>\r\n>The match winner was scored on a UCLA attack error, 16-14\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>NOTES\u003C/strong>\u003Cbr>\r\n>The Anteaters are battle-tested in five set matches this season, improving to 6-5 when going the distance\u003Cbr>\r\n>UCI snaps a 12 match losing streak against the Bruins\u003Cbr>\r\n>UCI is the first team to beat the Bruins on their home court since Long Beach State did it on Feb. 12, 2025",20372,"Anteaters move on to NCAA Final Four next week ","postgame","Stacey Shackleford",{"id":206,"title":254,"abbreviation":248,"shortTitle":22,"shortname":251,"facebook":249,"twitter":256,"gender":161,"pinterest":22,"instagram":253,"youtube":22,"globalSportShortname":251,"globalSportNameSlug":252,"tickets":255,"youtubePlaylistId":461,"globalSportId":250,"nonSport":122,"showAtVs":12,"gameSynonym":462},"PLfmn2nNyi07jlZGX3YGHKyWvaiHPyhWdX","Matches",{"caption":22,"creditText":4,"focalPoint":4,"url":454,"absoluteUrl":454,"altText":119,"title":4,"creditName":4},{"youtube":4,"archive":4,"metadata":465},{"title":4,"thumbnail":4},[],[468],{"gameImageUrl":469,"time":470,"conference":122,"gameCenterEnabled":122,"conferenceTitle":4,"conferenceAbbrev":4,"conferenceLogo":4,"location":471,"locationIndicator":472,"neutralHometeam":4,"atVs":473,"status":474,"noplayText":22,"type":475,"gameTeamPrefix":4,"gamePromotionText":4,"gamePromotionLink":22,"gameLinks":476,"promotionImageCaption":4,"promotionImageLink":4,"promotionImagePath":4,"isADoubleheader":122,"displayVsatIndicator":122,"gameProgram":477,"gameProgramLink":4,"opponent":478,"media":492,"result":503,"facility":4,"tournament":514,"galleries":515,"previewStoryId":4,"postStoryId":456,"hasWePlayedMoments":122,"ticketLink":516,"gameScheduleInclude":122,"gameCalendarExclude":122,"allDay":122,"tbd":122,"isSpotlight":12,"dateUtc":521,"endDateUtc":4,"appMedia":4,"id":522,"gameState":368,"gameStateDisplay":523,"date":524,"enddate":4,"sport":525},"https://ucirvinesports.com/images/2026/5/2/RTH_7813.jpg","5:00 PM","Los Angeles, CA","A","at","O","P",[],"Program",{"id":479,"globalId":480,"title":481,"prefix":22,"website":482,"websiteLabel":483,"location":471,"conference":122,"mascot":484,"image":485,"tournamentTitle":490,"tournamentColor":491,"color":4},56,96,"
