<!DOCTYPE HTML>

<html lang="en">


<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
	<title>University of California, San Diego | Campus Map</title>
	
	
	
	
	<link rel="stylesheet" type="text/css" href="/dependencies/decorator/css/UcsdDecorator4.css" media="all" >
	
	
   
    <style>
        body {
            position:absolute;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }
        .container {
            width: 100%;
            height: 100%;
         }
    </style>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    
    <script type="text/javascript">
    $(document).ready(function(){
    	$('#map_frame').attr('src', $('#map_frame').attr('src') + window.location.hash);
    });
    </script>
</head>

<body>



<div class="container">
    <iframe id="map_frame" src="https://map.concept3d.com/?id=1005" width="100%" height="100%" frameBorder="0" scrolling="no" border="0" style="border:0px solid #fff; margin:0; padding:0;" allow="geolocation"><p>Your browser does not support iframes.</p></iframe>
</div>



<script>
	function getUrlParameter(sParam)
	{
		var sPageURL = window.location.search.substring(1);
		var sURLVariables = sPageURL.split('&');
		for (var i = 0; i < sURLVariables.length; i++) 
		{
			var sParameterName = sURLVariables[i].split('=');
			if (sParameterName[0] == sParam) 
			{
					return sParameterName[1];
			}
		}
	}
	$(function() {
			// var id = getUrlParameter('id');
			var mrkIid = getUrlParameter('mrkIid');
			var build_parameter = "&mrkIid="+mrkIid;
			//console.log(mrkIid);
			if(mrkIid === undefined){
				//do nothing
			}
			else{
				//append url parameter to iframe
				$("#map_frame").attr("src", $("#map_frame").attr("src")+build_parameter);
			}
	});
</script>

</body>
</html>
