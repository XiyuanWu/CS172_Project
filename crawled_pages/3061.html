hor-illustrator duo Sherine \\nHamdy and Myra El Mir.  A timely, thought-provoking update to modern classics \\nlike Persepolis and Tahereh Mafi’s A Very Large Expanse of Sea, LANDING IN \\nPLACE showcases how the political is personal, Weaving important moments \\nin global history together through the lens of one Egyptian American family -- from \\nthe Suez crisis in 1956, to the Arab Spring and the events in Cairo’s Tahrir Square \\nin 2011, to present day protests for Palestinian rights.\\n\\nSpeaking to the inspirations for LANDING IN PLACE, author Sherine Hamdy said: \\n“In 2013, I wrote a rather snarky manuscript called Hijabville, based on my annoyed \\nexperiences wearing hijab in my early adulthood. Anisa, the hijabi character, never \\nspoke: everyone was always projecting their ideas and assumptions onto her, talking \\nto her, at her, about her. When I decided to give Anisa her voice, I had to trade snark for sincerity. The result was LANDING IN PLACE – a story that celebrates the beauty in Muslim cultures and hijab instead of rebelling against them. Through Anisa’s story, I hope readers feel empowered to discover the hidden historical and political traumas that inform their own families, as well as the important link between foreign intervention, neocolonialism, migration, and diaspora.”\\n\\nIn LANDING IN PLACE, Anisa is following in her sister Reem’s footsteps: She’s a freshman at her sister’s alma mater, she’s on the same premed track, and she’s inherited Reem\'s old hotpot, mini-fridge, and textbooks. Even though Anisa would prefer to study art, her parents discount that as a valid career choice. The path laid out before her starts to crumble as Anisa feels she doesn’t belong -- either in her organic chemistry class or among the other Muslim students on campus.\\n\\nWhen Anisa fails her first semester, she begs her parents to let her take time off to visit Cairo and stay with her beloved grandfather. Finally free to have her own experiences, Anisa begins a journey of self- discovery and, as she bumps up against familial, societal, and religious expectations, she starts to develop her own artistic voice. When Anisa returns to the United States, many of these expectations shift, but she learns to draw on the love of friends and family -- including those she’s often at odds with -- in order to stay true to herself.\\n"}],"B":[{"A?":"A","A":{"color":{"B":"#ffffff"},"font-family":{"B":"YAEg0gutZSA,0"},"font-kerning":{"B":"normal"},"font-size":{"B":"30.7049"}}},{"A?":"B","A":150},{"A?":"A","A":{"fill-id":{"B":"none"}}},{"A?":"B","A":1},{"A?":"A","A":{"font-family":{"B":"YAEg0gZeKpc,0"},"font-size":{"B":"24.0384"}}},{"A?":"B","A":2457},{"A?":"A","A":{"color":{},"fill-id":{},"font-family":{},"font-kerning":{},"font-size":{}}}],"E":{}},"b":{"A":[83,68,1,70,76,79,76,74,85,85,57,1,79,85,85,85,118,112,115,108,26,1,110,111,117,116,27,1,116,117,116,116,92]},"d":"A","l":false,"g":false,"h":"A"},{"A?":"K","A":1270.1949109738946,"B":159.890625,"D":1046.21875,"C":67.66667,"E":0.0,"F":0.0,"BD":[],"BE":[],"BA":[],"BB":[],"Q":false,"S":false,"P":[],"5":{},"T":{},"W":{},"_":"LBB4FnzSR2QnJ6B6","a":{"A":[{"A?":"A","A":"COPIES OF THE BOOK WILL BE AVAILABLE FOR PURCHASE AT THE EVENT\\nor purchase online\\n"}],"B":[{"A?":"A","A":{"color":{"B":"#ffe552"},"font-family":{"B":"YAEg0gutZSA,0"},"font-kerning":{"B":"normal"},"font-size":{"B":"32.0"},"link":{"B":"https://www.penguinrandomhouse.com/books/553503/landing-in-place-a-graphic-novel-by-written-by-sherine-hamdy-illustrated-by-myra-el-mir/"},"text-align":{"B":"center"}}},{"A?":"B","A":63},{"A?":"A","A":{"color":{"B":"#ffffff"},"decoration":{"B":"underline"},"font-family":{"B":"YAEg0gZeKpc,0"},"font-size":{"B":"21.3333"}}},{"A?":"B","A":18},{"A?":"A","A":{"fill-id":{"B":"none"},"font-style":{"B":"normal"},"font-weight":{"B":"normal"}}},{"A?":"B","A":1},{"A?":"A","A":{"color":{},"decoration":{},"fill-id":{},"font-family":{},"font-kerning":{},"font-size":{},"font-style":{},"font-weight":{
