              <div class="field__item">  <img loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/2025-03/Parking-Valet-MB-112.jpg" width="5309" height="3318" alt="parking valet at MB" />

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><h2>Parnassus Heights</h2><p>UCSF Park and Ride program offers monthly permits to park at nearby parking facilities with regular UCSF shuttle service to Parnassus Heights. <a href="https://campuslifeserviceshome.ucsf.edu/transportation/park-and-ride">Sign up for Park and Ride</a>.&nbsp;</p><p>Non-UCSF parking facilities at hourly, daily, and monthly rates are available around the campus.&nbsp;</p><figure class="responsive-figure-table"><table><thead><tr><th><strong>Name | Location</strong></th><th><strong>Parking Availability&nbsp;</strong></th><th><strong>Type</strong></th><th><strong>Features</strong></th><th><strong>Hours</strong></th></tr></thead><tbody><tr><td colspan="5"><p>&nbsp;</p><p><strong>On-Site Parking</strong></p><p>&nbsp;</p></td></tr><tr><td><strong>ACC Garage | 2 Irving</strong></td><td>Restricted parking only*</td><td>Garage</td><td>EV Charging</td><td>24/7</td></tr><tr><td><strong>Westside Surface Lot | 50 Kirkham</strong></td><td><ul><li>Patients</li><li>Visitors</li><li>Restricted parking only*</li><li>Child care drop off only&nbsp;</li></ul></td><td>Lot&nbsp;</td><td>N/A</td><td>24/7</td></tr><tr><td><strong>Millberry Union Patient and Visitor Garage | 500 Parnassus</strong></td><td><ul><li>Patients - encouraged to valet</li><li>Visitors</li><li>L/N parking permits only</li></ul></td><td>Garage</td><td>EV Charging</td><td>24/7</td></tr><tr><td colspan="5"><p>&nbsp;</p><p><strong>Park and Ride&nbsp;</strong></p><p>&nbsp;</p></td></tr><tr><td><strong>Japan Center | 1610 Geary Blvd.</strong></td><td>Employees - monthly permit required</td><td>Garage</td><td>EV Charging&nbsp;</td><td><div>Mon. - Fri., 5 a.m. - 10 p.m.</div><div><em>Park and Ride access hours vary from regular operating hours.</em></div></td></tr><tr><td><strong>Buchanan Dental | 100 Buchanan&nbsp;</strong></td><td>Employees - monthly permit required</td><td>Garage</td><td><em>N/A</em></td><td><div>Mon. - Fri., 7 a.m. - 7 p.m.</div><div><em>Park and Ride access hours vary from regular operating hours.</em></div></td></tr><tr><td colspan="5"><p>&nbsp;</p><p><strong>Non-UCSF Parking Options</strong></p><p>&nbsp;</p></td></tr><tr><td><strong>Kezar Lot | 825 Stanyan St.</strong></td><td>Hourly, Daily, Monthly</td><td>Garage&nbsp;</td><td>&nbsp;EV Charging</td><td>Mon. - Fri., 5 a.m. - 11 p.m.; Sat. - Sun., 9 a.m. - 11 p.m.</td></tr><tr><td><strong>Music Concourse | 800 10th Ave.</strong></td><td>Hourly, Daily, Monthly</td><td>Garage&nbsp;</td><td>EV Charging</td><td>Mon. - Sun., 7 a.m. - 7 p.m.</td></tr><tr><td><strong>Japan Center | 1610 Geary Blvd.</strong></td><td>Hourly, Daily, Monthly</td><td>Garage</td><td><div>EV Charging</div></td><td><div>Mon. - Fri., 5 a.m. - 11 p.m.; Sat. - Sun., 9 a.m. - 11 p.m.</div></td></tr></tbody></table></figure><p>*Parking with parking monthly permit only.&nbsp;</p><h2>Mission Bay Parking</h2><figure class="responsive-figure-table"><table><thead><tr><th><strong>Name | Location</strong></th><th>Parking Availability</th><th>Type</th><th>Features</th><th>Hours</th></tr></thead><tbody><tr><td><strong>Community Center Garage | 1625 Owens</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Garage</td><td>EV Charging</td><td>24/7</td></tr><tr><td><strong>Third Street Garage | 1650 Third Street</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Garage</td><td>EV Charging</td><td>24/7</td></tr><tr><td><strong>Nelson Rising Lane Surface Lot 4 | 727 Nelson Rising Lane</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Lot</td><td>N/A</td><td>24/7</td></tr><tr><td><strong>Mission Hall Surface Parking Lot | 1750 3rd St.</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Lot</td><td>N/A</td><td>24/7</td></tr></tbody></table></figure><h2>Mount Zion</h2><figure class="responsive-figure-table"><table><thead><tr><th><strong>Name | Location</strong></th><th>Parking Availability</th><th>Type</th><th>Features</th><th>Hours</th></tr></thead><tbody><tr><td><strong>2420 Sutter&nbsp;</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Garage</td><td>EV Charging</td><td>Mon.-Fri., 7 a.m. - 8:30 p.m.</td></tr><tr><td><strong>2505 Bush Street Surface Lot</strong></td><td><ul><li>Employees</li><li>Patients and Visitors</li><li>Students</li></ul></td><td>Lot</td><td>N/A</td><td>24/7</td></tr></tbody></table></figure><h2>Mission Center Building</h2><figure class="responsive-figure-table"><table><thead><tr><th><strong>Name | Location</strong></th><th>Parking Availability</th><th>Type</th><th>Features</th><th>Hours</th></tr></thead><tbody><tr><td><strong>Mission Center Building | 1855 Folsom</strong></td><td>Mission Center Building</td><td>Lot</td><td>N/A</td><td>24/7</td></tr></tbody></table></figure><h2>Buchanan Dental</h2><figure class="responsive-figure-table"><table><thead><tr><th><strong>Name | Location</strong></th><th>Parking Availability</th><th>Type</th><th>Features</th><th>Hours</th></tr></thead><tbody><tr><td><strong>Buchanan Dental | 100 Buchanan&nbsp;</strong></td><td>Buchanan Dental</td><td>Garage</td><td>N/A</td><td>Mon. - Fri., 7 a.m. - 7 p.m.</td></tr></tbody></table></figure><h2>Enforcement</h2><p>Vehicles will be cited immediately. Multiple citations to the same vehicle will not be issued within a 24-hour period for the same violation. Enforcement is in effect 7 days a week.</p></div>

<article data-history-node-id="15606" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/transportation/news/survey-feedback-shuttle-service-how-lilac-route-was-created" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">From Survey Feedback to Shuttle Service: How the Lilac Route Was Created </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10501" hreflang="en">TRN-lilac-boarding-MB.png</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><div><p>When UCSF Transportation reviewed more than 4,000 open-ended responses from the 2024 Commute Survey, one theme stood out: stronger connections to regional transit.&nbsp;</p></div><div><p>“We saw an interest in connections to BART and ferry service, and specific calls to connect to the San Francisco Ferry Building,” shared Transportation Demand Manager Tyler Dewey, who helps review survey feedback.&nbsp;</p></div><div><p>According to responses from both UCSF Health and Campus staff, commuting could become easier with smoother transfers and better coordination with regional systems.&nbsp;</p></div><div><h2>From Feedback to Route Design&nbsp;</h2></div><figure role="group" class="caption caption-img align-right">
<img alt="Tyler smiling" data-entity-type="file" data-entity-uuid="cc068424-c2d1-4a24-89de-66df880fab06" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Tyler%20Dewey.jpg.webp?itok=yGTnzC8J" width="200" height="300" class="image-style-full-size-width-1208">
<figcaption><em>Tyler Dewey, transportation demand manager</em></figcaption>
</figure>
<div><p>The transportation team analyzed survey comments through a combination of manual review and AI-supported sorting to identify clear patterns.&nbsp;</p></div><div><p>“That level of review allowed us to identify common themes,” Dewey said.&nbsp;</p></div><div><p>Once demand for stronger regional connections became clear, the team began designing what would become the <a href="https://campuslifeserviceshome.ucsf.edu/transportation/lilac-route-shuttle-schedule">Lilac Shuttle</a>.&nbsp;</p></div><div><p>Route development required careful planning — including service hours, frequency, stop locations, driver availability, and vehicle resources. Using transit planning software called Remix, the team modeled the future Lilac route alongside regional transit schedules to improve transfer coordination.&nbsp;</p></div><div><p>“Other regional transit agencies use the same software, which allows us to reference their timetables and design the smoothest transfers possible between public transit systems,” Dewey explained.&nbsp;</p></div><div><h2>A Growing Success&nbsp;</h2></div><div><dom-quote class="align--right size--half" data-color="blue"><div class="blockquote-content" slot="blockquote-content">“The Grey, Blue, and Gold shuttles are the backbone of the UCSF shuttle system, but the Lilac is quickly becoming a UCSF favorite.”</div><div class="blockquote-source" slot="blockquote-source">Tyler Dewey</div><div class="blockquote-source" slot="blockquote-source">Transportation Demand Manager</div></dom-quote><p>The Lilac is quickly becoming one of UCSF’s top-performing routes.&nbsp;</p></div><div><p>Ridership continues to increase, and our performance metrics are showing steady month-over-month improvement.&nbsp;</p></div><div><p>“The Grey, Blue, and Gold shuttles are the backbone of the UCSF shuttle system, but the Lilac is quickly becoming a UCSF favorite,” Dewey said.&nbsp;</p></div><div><p>The Lilac Shuttle didn’t start in a conference room. It started with feedback from the 2024 Commute Survey.&nbsp;</p></div><div><p>“This is not a survey that is put on the shelf,” Dewey said. “The more people who respond and the more honest the answers, the better we can craft commute programs that work for all of us at UCSF.”&nbsp;</p></div><div><p>The 2026 Commute Survey is open now through March 20, 2026. Share your input and help shape what comes next. <a href="https://dp.ucsf.edu/idp/profile/SAML2/Redirect/SSO?execution=e1s1">Take the survey.</a></p></div></div>

<article data-history-node-id="15091" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/transportation/news/rain-or-shine-my-guide-biking" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Rain or Shine: My Guide to Biking</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10226" hreflang="en">TRN Tyler Dewey on Bike.png</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p><em><strong>By Tyler Dewey, CLS Marketing Writer</strong></em></p><p>One of the best things about working for UCSF Transportation is the diverse range of ways we support navigating the city. Of course, our Parking and Shuttle teams do incredible work supporting drivers and transit riders, but Transportation also supports biking, walking, scooting, and more!</p><p>On my first day at UCSF, I signed up for a bike permit, which included access to our secure bike rooms. I’ve now been a year-round, everyday bike commuter for years. Yes, winter brings cooler temps, early sunsets, and more rain. Some days are a challenge, but with a few tweaks, riding through the winter can be comfortable, safe, and fun.</p><p><strong>Dress to Impress (and Stay Warm)</strong><br>My winter commute prep begins before I get on my bike. Gloves, our UCSF Transportation scarf, and layers are a must. For maximum warmth, I would love to wear mittens, but mittens make it harder to squeeze my brakes. On really cold days, I may double-layer a thick wool glove over a thin cotton glove. Luckily, this type of cold is rare. I am bald (sadly), so I always wear a hat under my helmet. I also recommend boots and thicker socks, if possible. Once I get going, my core stays warm, but my hands and feet are harder to keep cozy. When it rains, I recommend keeping a pair of dry socks in your desk locker or bag. Being able to change out of wet socks is a game-changer!</p><p>With my fit selected, I next prep my bike. In the winter, that means a basket (to shed or store extra layers like my rain poncho), fenders (to keep the rain off my legs), and lights (the most important).</p><p><strong>Ride Bright</strong><br>Once we “fall back,” evening commutes are dark. The key is to be seen and to see. This includes brightening both the bike and yourself! California law requires the use of a front light and reflectors when riding at night. Some “blinky” lights are great for being seen. More powerful, steady lights are great for lighting up the road ahead. I have a “dynamo” front light that uses batteries inside the front hub to generate enough electricity to power the front light. However, if I am riding somewhere without many streetlights, I may add a battery light to my handlebars.</p><p>Any local bike shop will have a variety of options for handlebar-mounted lights. I recommend USB-rechargeable versions for longevity. Standard lights help provide visibility on the road, but I also recommend personalizing your ride to make it more enjoyable and unique. I have a front white reflector shaped like a little onigiri rice ball. I also bought rolls of white and red reflective tape and cut them into fun shapes. Thus far, I have a <em>Star Wars</em> Rebel Alliance, a <em>Mad Max </em>reference, hearts, and designs from my favorite books.</p><p>I like placing lights or reflectors at various heights: reflective ankle bands or pedal reflectors, a rear light near the saddle, and reflective elements on your helmet or bag. to create a clear "human on a bike" outline. You can test the effectiveness of your visibility by having someone take a photo of your lights and reflectors at night with the flash on. The flash will activate the reflectors and allow you to verify that all the reflectors and lights are visible.</p><p>With my fit on point and my bike blazing bright, I am ready to roll day or night, rain or shine.</p><p>With a little preparation—layers, lights, fenders, and a calmer route—winter bike commuting to UCSF is safe, easy, and enjoyable. If you spot me out there, give a wave!</p></div>

            <h2 class="node__title">
        <a href="/transportation/news/casual-carpooling-back" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Casual Carpooling Is Back</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10006" hreflang="en">TRN Casual Carpool 511.png</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><div><p>Casual carpooling is back in the Bay Area. This community-based commute option connects drivers and passengers heading to San Francisco — no apps, reservations, or sign-ups required.&nbsp;</p></div><div><h2><strong>How It Works</strong>&nbsp;</h2></div><div><p>According to 511.org, casual carpooling is a grassroots system that operates at more than 20 East Bay pickup spots during weekday mornings.&nbsp;</p></div><div><ol><li>Drivers and passengers line up at a pickup location.&nbsp;</li></ol></div><div><ol start="2"><li>When a car has two passengers and one driver, the group can use the carpool lane and pay for a reduced Bay Bridge toll.&nbsp;</li></ol></div><div><ol start="3"><li>Everyone benefits — drivers save time, passengers ride for free or share small costs, and the group helps reduce traffic and emissions.&nbsp;</li></ol></div><div><p>The system first began in the 1970s and quickly became a Bay Area tradition. After a pause during the pandemic, casual carpooling has returned in areas such as Oakland, Berkeley, and Lafayette, where demand has grown.&nbsp;</p></div><div><h2><strong>Why Try It</strong>&nbsp;</h2></div><div><p>Based on information from <a href="https://sfcasualcarpool.com/">sfcasualcarpool.com</a>, casual carpooling offers several advantages:&nbsp;</p></div><div><ul><li><strong>Save time:</strong> Trips can be up to 20 minutes faster than driving alone or taking BART.&nbsp;</li></ul></div><div><ul><li><strong>Save money:</strong> Drivers and riders share toll and gas savings.&nbsp;</li></ul></div><div><ul><li><strong>Reduce congestion:</strong> Fewer solo drivers mean less traffic.&nbsp;</li></ul></div><div><ul><li><strong>Lower emissions:</strong> Sharing a ride helps cut carbon output.&nbsp;</li></ul></div><div><h2><strong>Find Your Pickup Spot</strong>&nbsp;</h2></div><div><p>Ready to try it?&nbsp;</p></div><div><ul><li>Visit 511.org’s <a href="https://511.org/carpool/casual">Casual Carpool</a> page for an updated list of pickup locations and maps.&nbsp;</li></ul></div><div><ul><li>Or check <a href="https://sfcasualcarpool.com/">sfcasualcarpool.com</a> to find the closest spot near you and learn more about how it works.&nbsp;</li></ul></div><div><p>Even joining a casual carpool once a week can make your commute faster, more affordable, and better for the environment.&nbsp;</p></div></div>

            <h2 class="node__title">
        <a href="/transportation/news/how-uber-commute-shuttle-changed-alyscias-commute" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">How the Uber Commute Shuttle Changed Alyscia’s Commute</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/9981" hreflang="en">TRN Alyscia Richards-Uber Commute Shuttle.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>The daily trip from Mission Bay to the Panhandle once took Alyscia Richards, executive assistant to the dean of the UCSF School of Pharmacy, more than an hour. Now, thanks to the Uber Commute Shuttle, her commute is quicker and more relaxing. Learn more about her experience below.</p><p>&nbsp;</p><p><strong>What made you decide to start using the Uber Commute Shuttle?</strong></p><p>As soon as I saw there was a Panhandle route, I jumped at the chance to sign up for the Uber Commute Shuttle. Getting between Mission Bay and that neighborhood can be quite a journey on SF Muni. My concerns about the cost or whether I’d like it went away when I learned you sign up monthly. That flexibility made it easy to try without a big commitment, because if it didn’t work for me, I could simply opt out after a month.</p><p>&nbsp;</p><p><strong>How did you first hear about it?</strong></p><p>I first heard the Uber Commute Shuttle was in development when I spoke with the <a href="https://campuslifeserviceshome.ucsf.edu/transportation/commute-concierge-consultations">Commute Concierge</a> team. We were troubleshooting the best transit options, and at the time, there wasn’t a direct route to my neighborhood (NOPA–Panhandle) using UCSF shuttles or SF Muni. They mentioned that an Uber Commute Shuttle route might eventually get closer to where I live and encouraged me to keep an eye out for updates. When I later saw the email announcement on UCSF Pulse, I signed up right away.</p><p>&nbsp;</p><p><strong>How has it changed your daily commute?</strong></p><p>It has shortened my commute significantly and made it much more consistent — something that was always an issue with SF Muni, especially in the evenings. My trip home from Mission Bay used to take over an hour, sometimes up to an hour and a half. Now, the Uber Commute Shuttle gets me home in about 40–50 minutes, without the need to transfer between buses or shuttles. It’s so much easier to hop on one shuttle with only a few stops and get dropped off just four blocks from my home. I still take SF Muni when I’m working at Parnassus Heights since that route is convenient, but since my main location is Mission Bay, the Uber Commute Shuttle has truly been a game changer.</p><p>&nbsp;</p><p><strong>What do you like most about the Uber Commute Shuttle?</strong></p><p>Only needing to take one shuttle has vastly improved my commute and quality of life. It’s shortened my travel time, reduced the stress of waiting for connections, and provided a dependable schedule. I also love the flexibility of being able to choose which shuttle I take each day. The drivers are consistently kind, professional, and helpful. Honestly, the best part of my route is riding over the hill by Dolores Park. The view is stunning, and I love seeing it every day!</p><p>&nbsp;</p><p><strong>How does it compare to driving alone or taking public transit?</strong></p><p>I don’t have a car to drive, so my options were limited to UCSF shuttles or SF Muni — or a combination of both. The Uber Commute Shuttle is easy, reliable, and stress-free while still offering flexibility. For me, it’s absolutely worth the cost since it cuts my commute time in half compared to SF Muni.</p><p>&nbsp;</p><p><strong>What benefits have you noticed (saving money, less stress, or meeting new people)?</strong></p><p>I’m far less stressed about getting to and from work. The rides give me a chance to unwind before and after my workday — whether that’s listening to music or podcasts, doing crossword puzzles, or catching up on reading. My family really appreciates that I get home earlier now, and I love having that extra time back instead of spending it waiting for another bus.</p><p>&nbsp;</p><p><strong>How does using the shuttle support your work-life balance at UCSF?</strong></p><p>Spending less time commuting means more time with my family. The cost of the Uber Commute Shuttle is worth it because I often get home in half the time. Plus, the quiet time during my ride gives me a rare opportunity to relax — something this busy mom doesn’t get often. It’s definitely more peaceful than the often crowded and noisy Muni buses.</p><p>&nbsp;</p><p><strong>What would you say to coworkers who are thinking about giving it a try?</strong></p><p>I’d absolutely recommend it if one of the routes serves your area or helps you avoid taking multiple buses or shuttles. You can sign up for a month to see if it’s a good fit — no long-term commitment required. I never imagined I’d switch from SF Muni after so many years, but the Uber Commute Shuttle has made my life so much easier. It might do the same for you.</p></div>

</a>
      </h2>

  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>UCSF Transportation’s frontline staff are now sporting a fresh, standardized look thanks to a new uniform program launched in late July.&nbsp;</p><p>The initiative replaces the old voucher system — where employees purchased their own workwear — with a fully managed service that takes care of both supply and laundry.</p><p>“We wanted to standardize everything so staff wouldn’t have to worry about uniforms or cleaning them,” said Tim Alt, Assistant Director for Transportation.&nbsp;</p><p>Each employee is issued 11 sets of uniforms: five for the current week, five for the next, and the one they’re wearing. Every Friday, five freshly laundered uniforms are delivered, and worn ones are picked up.</p><p>The rollout covers all frontline roles, including shuttle drivers, parking staff, and valet attendants. Uniforms consist of black pants with navy or black shirts, available in breathable polo or long-sleeve styles chosen by the employee. Shoes and outerwear will be addressed in a future phase.</p><p>The benefits extend beyond convenience.&nbsp;</p><p>“It keeps everyone looking professional and unified while still allowing for individual sizing and style preferences,” Alt explained.&nbsp;</p><p>With clean, consistent uniforms arriving each week, the program is already making a visible difference — helping staff feel equipped, supported, and ready to represent UCSF with pride</p></div>
