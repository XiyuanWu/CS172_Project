.com/sharing/share-offsite/?url=" target="_blank" class="s-share-item s-share-item__linkedin flex w-full items-center justify-center text-center text-[18px] last:border-0 border-r" aria-label="Share via Linked-in, opens in new tab"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-social-linkedin s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-linkedin"></use></svg></a></div></div><!----><!----><!----></div><div class="flex pt-[32px]"><!----><div id="storyContainer" class="relative w-full print:static"><!--[--><span></span><!----><div id="storyPageContentBody" data-safe-html="true" class="prose story-page__content__body s-text-paragraph-longform text-theme-safe min-h-[200px] max-w-none"><strong>Gulf Shores, Ala.</strong> - No. 3 seed UCLA defeated No. 1 seed Stanford 3-0 in the national championship match to win its third NCAA title and first since 2019. The championship is the third by a UCLA team this season and 127th overall by the athletics department.<br>
<br>
Sunday's win over Stanford earns UCLA its third title in its sixth overall championship appearance, and its first championship under third-year head coach <dfn><a href="/sports/womens-beach-volleyball/roster/coaches/jenny-johnson-jordan/4315" rel="smarttag" rev="4315">Jenny Johnson Jordan</a></dfn>.<br>
<br>
"It is sweet to win national championship No. 127 for the school, for this team, for this program," Johnson Jordan said. "We are excited to celebrate a little bit more here, but we are more excited to go home and celebrate with everybody. It's a really special one, especially for <dfn><a href="/sports/womens-beach-volleyball/roster/maggie-boyd/15562" rel="smarttag" rev="15562">Maggie Boyd</a></dfn>, who has been here four years, and who has been so close so many times. I remember last year after we lost saying next year we are going to have your back, and I'm so glad that we were able to do that today."<br>
 <br>
UCLA won the first set on all five courts to gain early momentum. <dfn><a href="/sports/womens-beach-volleyball/roster/kaley-mathews/15569" rel="smarttag" rev="15569">Kaley Mathews</a></dfn> and <dfn><a href="/sports/womens-beach-volleyball/roster/ensley-alden/15561" rel="smarttag" rev="15561"><dfn><a href="/sports/womens-beach-volleyball/roster/ensley-alden/15561" rel="smarttag" rev="15561">Ensley Alden</a></dfn></a></dfn> put the Bruins on the board first with a 21-16, 21-11 victory over Brooke Rockwell and Ruby Sorra. <dfn><a href="/sports/womens-beach-volleyball/roster/ava-williamson/15576" rel="smarttag" rev="15576">Ava Williamson</a></dfn> and <dfn><a href="/sports/womens-beach-volleyball/roster/jesse-dueck/15574" rel="smarttag" rev="15574">Jesse Dueck</a></dfn> followed with a 21-17, 25-23 victory on court 4, winning on their fifth match point on a service ace by Williamson.<br>
<br>
The Bruins needed just one more win across the three remaining courts to seal their third national championship, and were leading on all three courts. Fittingly for the Bruins, it was their No. 1 pair of <dfn><a href="/sports/womens-beach-volleyball/roster/sally-perez/15571" rel="smarttag" rev="15571">Sally Perez</a></dfn> and <dfn><a href="/sports/womens-beach-volleyball/roster/maggie-boyd/15562" rel="smarttag" rev="15562">Maggie Boyd</a></dfn> who clinched the title. After taking their first set 21-11, the duo took the second set 21-19 to seal the 3-0 sweep and the national championship for the Bruins.

":22,"video":516,"url":13,"redirectAbsoluteUrl":22,"links":521,"homepageFeedTemplate":22,"games":531,"galleryId":591,"galleryImages":595,"writer":4,"players":596,"globalSportMapName":407,"storyMetaDescription":4,"storyMetaOgDescription":4,"storyMetaKeywords":4,"storyMetaOgTitle":4,"imageCreditText":515,"alternateImage":4,"insideContentImage":4,"formattedDate":676,"gamePostStoryId":4,"isMediaOnStoryPage":12},"70509","2026-05-03T10:46:00","/images/2026/5/3/20260503_BVB_Stanford_RT_RPT_5299.jpg","\u003Cstrong>Gulf Shores, Ala.\u003C/strong> - No. 3 seed UCLA defeated No. 1 seed Stanford 3-0 in the national championship match to win its third NCAA title and first since 2019. The championship is the third by a UCLA team this season and 127th overall by the athletics department.\u003Cbr>\r\n\u003Cbr>\r\nSunday's win over Stanford earns UCLA its third title in its sixth overall championship appearance, and its first championship under third-year head coach \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/coaches/jenny-johnson-jordan/4315\" rel=\"smarttag\" rev=\"4315\">Jenny Johnson Jordan\u003C/a>\u003C/dfn>.\u003Cbr>\r\n\u003Cbr>\r\n\"It is sweet to win national championship No. 127 for the school, for this team, for this program,\" Johnson Jordan said. \"We are excited to celebrate a little bit more here, but we are more excited to go home and celebrate with everybody. It's a really special one, especially for \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/maggie-boyd/15562\" rel=\"smarttag\" rev=\"15562\">Maggie Boyd\u003C/a>\u003C/dfn>, who has been here four years, and who has been so close so many times. I remember last year after we lost saying next year we are going to have your back, and I'm so glad that we were able to do that today.\"\u003Cbr>\r\n \u003Cbr>\r\nUCLA won the first set on all five courts to gain early momentum. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/kaley-mathews/15569\" rel=\"smarttag\" rev=\"15569\">Kaley Mathews\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ensley-alden/15561\" rel=\"smarttag\" rev=\"15561\">\u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ensley-alden/15561\" rel=\"smarttag\" rev=\"15561\">Ensley Alden\u003C/a>\u003C/dfn>\u003C/a>\u003C/dfn> put the Bruins on the board first with a 21-16, 21-11 victory over Brooke Rockwell and Ruby Sorra. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ava-williamson/15576\" rel=\"smarttag\" rev=\"15576\">Ava Williamson\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/jesse-dueck/15574\" rel=\"smarttag\" rev=\"15574\">Jesse Dueck\u003C/a>\u003C/dfn> followed with a 21-17, 25-23 victory on court 4, winning on their fifth match point on a service ace by Williamson.\u003Cbr>\r\n\u003Cbr>\r\nThe Bruins needed just one more win across the three remaining courts to seal their third national championship, and were leading on all three courts. Fittingly for the Bruins, it was their No. 1 pair of \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/sally-perez/15571\" rel=\"smarttag\" rev=\"15571\">Sally Perez\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/maggie-boyd/15562\" rel=\"smarttag\" rev=\"15562\">Maggie Boyd\u003C/a>\u003C/dfn> who clinched the title. After taking their first set 21-11, the duo took the second set 21-19 to seal the 3-0 sweep and the national championship for the Bruins.\r\n\u003Cblockquote class=\"twitter-tweet\">\r\n\u003Cp dir=\"ltr\" lang=\"en\">THE BRUINS ARE YOUR 2026 NATIONAL CHAMPIONS ????\u003Ca href=\"https://twitter.com/hashtag/NCAABeachVB?src=hash&amp;ref_src=twsrc%5Etfw\">#NCAABeachVB\u003C/a> x ?? ESPN / \u003Ca href=\"https://twitter.com/uclabeachvb?ref_src=twsrc%5Etfw\">@uclabeachvb\u003C/a> \u003Ca href=\"https://t.co/Wdi8iOrrRv\">pic.twitter.com/Wdi8iOrrRv\u003C/a>\u003C/p>\r\n— NCAA Women's Volleyball (@NCAAVolleyball) \u003Ca href=\"https://twitter.com/NCAAVolleyball/status/2050991366662926674?ref_src=twsrc%5Etfw\">May 3, 2026\u003C/a>\u003C/blockquote>\r\n\u003Cscript async=\"\" src=\"https://platform.twitter.com/widgets.js\" charset=\"utf-8\">\u003C/script>  \u003Cbr>\r\nThree Bruin pairs were named to the NCAA All-Tournament Team - Boyd and Perez on court 1, \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/harper-cooper/15564\" rel=\"smarttag\" rev=\"15564\">Harper Cooper\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/alexa-fernandez/15566\" rel=\"smarttag\" rev=\"15566\">Alexa Fernandez\u003C/a>\u003C/dfn> on court 3 and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/kenzie-brower/15563\" rel=\"smarttag\" rev=\"15563\">Kenzie Brower\u003C/a>\u003C/dfn> and \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/mallory-labreche/15575\" rel=\"smarttag\" rev=\"15575\">Mallory LaBreche\u003C/a>\u003C/dfn> on court 5. \u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>No. 3 UCLA No. 1 Stanford  \u003C/strong>\u003Cbr>\r\n\u003Cstrong>Gulf Shores, Ala.\u003C/strong>\u003Cbr>\r\n\u003Cstrong>Sunday, May 3, 2026 • 11:30 am CT\u003C/strong>\u003Cbr>\r\n\u003Cstrong>Records: UCLA (34-6), Stanford (39-5)\u003C/strong>\u003Cbr>\r\n \u003Cbr>\r\n1. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/sally-perez/15571\" rel=\"smarttag\" rev=\"15571\">Sally Perez\u003C/a>\u003C/dfn> / \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/maggie-boyd/15562\" rel=\"smarttag\" rev=\"15562\">Maggie Boyd\u003C/a>\u003C/dfn> (UCLA) def. Kelly Belardi / Avery Jackson (STAN) 21-11, 21-19\u003Cbr>\r\n2. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/kaley-mathews/15569\" rel=\"smarttag\" rev=\"15569\">Kaley Mathews\u003C/a>\u003C/dfn> / \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ensley-alden/15561\" rel=\"smarttag\" rev=\"15561\">\u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ensley-alden/15561\" rel=\"smarttag\" rev=\"15561\">Ensley Alden\u003C/a>\u003C/dfn>\u003C/a>\u003C/dfn> (UCLA) def. Brooke Rockwell / Ruby Sorra (STAN) 21-16, 21-11\u003Cbr>\r\n3. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/alexa-fernandez/15566\" rel=\"smarttag\" rev=\"15566\">Alexa Fernandez\u003C/a>\u003C/dfn> / \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/harper-cooper/15564\" rel=\"smarttag\" rev=\"15564\">Harper Cooper\u003C/a>\u003C/dfn> (UCLA) vs. Charlotta Bell / Logan Tusher (STAN) 21-19, 19-8 unf.\u003Cbr>\r\n4. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/ava-williamson/15576\" rel=\"smarttag\" rev=\"15576\">Ava Williamson\u003C/a>\u003C/dfn> / \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/jesse-dueck/15574\" rel=\"smarttag\" rev=\"15574\">Jesse Dueck\u003C/a>\u003C/dfn> (UCLA) def. Indigo Clarke / Clara Stowell (STAN) 21-17, 25-23\u003Cbr>\r\n5. \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/kenzie-brower/15563\" rel=\"smarttag\" rev=\"15563\">Kenzie Brower\u003C/a>\u003C/dfn> / \u003Cdfn>\u003Ca href=\"/sports/womens-beach-volleyball/roster/mallory-labreche/15575\" rel=\"smarttag\" rev=\"15575\">Mallory LaBreche\u003C/a>\u003C/dfn> (UCLA) vs. Elena Fisher / Chloe Hoffman (STAN) 21-12, 18-15 unf.\u003Cbr>\r\n \u003Cbr>\r\nOrder of finish: 2, 4, 1*\u003Cbr>\r\n ",70509,"No. 3 seed UCLA defeated No. 1 seed Stanford 3-0 in the national championship match to win its third NCAA title and first since 2019. ","postgame",{"id":405,"title":408,"abbreviation":400,"shortTitle":22,"shortname":407,"facebook":401,"twitter":406,"gender":294,"pinterest":22,"instagram":406,"youtube":22,"globalSportShortname":403,"globalSportNameSlug":404,"tickets":22,"youtubePlaylistId":512,"globalSportId":402,"nonSport":125,"showAtVs":12,"gameSynonym":513},"PLMrXynvCdGwfH8ij05agMtWn0PnGZljNQ","Matches",{"caption":22,"creditText":515,"focalPoint":4,"url":
