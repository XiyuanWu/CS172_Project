    <script>
        function detectIEEdge() {
            var ua = window.navigator.userAgent;

            var msie = ua.indexOf('MSIE ');
            if (msie > 0) {
                // IE 10 or older => return version number
                return parseInt(ua.substring(msie + 5, ua.indexOf('.', msie)), 10);
            }

            var trident = ua.indexOf('Trident/');
            if (trident > 0) {
                // IE 11 => return version number
                var rv = ua.indexOf('rv:');
                return parseInt(ua.substring(rv + 3, ua.indexOf('.', rv)), 10);
            }

            var edge = ua.indexOf('Edge/');
            if (edge > 0) {
                // Edge => return version number
                return parseInt(ua.substring(edge + 5, ua.indexOf('.', edge)), 10);
            }

            // other browser
            return false;
        }
        var ieVersion = detectIEEdge()
    </script>

    // Google Maps globals - required for async loading
    // The callback signals the script loaded; React polling validates places availability
    window.__mapsLoadingStarted = window.__mapsLoadingStarted || false
    window.__mapsCallbackFiredAt = null
    window.onGoogleMapsReady = function () {

    // Script Manager Class
    class ScriptManager {
        static consentCategories = {
            ANALYTICS: "analytics",
            ADVERTISING: "advertising",
            FUNCTIONAL: "functional",
            ESSENTIAL: "essential",
        }

        constructor() {
            this.loadedScripts = new Set()
        }

        loadScript(config) {
            const { name, src, category, condition, onLoad, onError, charset, async = true } = config

            // Use name as identifier if no src (for inline-only scripts like facebook_pixel)
            const scriptId = src || name
            if (this.loadedScripts.has(scriptId)) return
            if (condition && !condition()) return

            // If no src, just run onLoad (for scripts that inject themselves)
            // Use setTimeout to match async behavior of script.onload
            if (!src) {
                this.loadedScripts.add(scriptId)
                if (onLoad) {
                    setTimeout(() => {
                        try {
                            onLoad()
                        } catch (e) {
                            if (onError) onError(e, name)
                            else console.warn(`Failed to execute script: ${name}`, e)
                        }
                    }, 0)
                }
                return
            }

            const script = document.createElement("script")
            script.src = src
            script.async = async
            if (charset) script.charset = charset
            if (onLoad) script.onload = onLoad
            script.onerror = (e) => (onError ? onError(e, src) : console.warn(`Failed to load script: ${src}`))

            document.head.appendChild(script)
            this.loadedScripts.add(scriptId)
        }

        hasConsent(category) {
            if (category === ScriptManager.consentCategories.ESSENTIAL) return true

            const cookieConsent = this.getCookieConsent()
            if (cookieConsent && cookieConsent.length > 0) {
                return cookieConsent.includes(category)
            }

            return false
        }

        getCookieConsent() {
            const consentCookie = localStorage.getItem("quorum_cookie_consent")
            if (consentCookie) {
                try {
                    return JSON.parse(consentCookie)
                } catch (e) {
                    console.warn('Failed to parse quorum_cookie_consent:', e)
                    return []
                }
            }
            return []
        }
    }

    // Initialize and expose globally
    function initializeScriptManager(templateVars) {
        const SCRIPT_CONFIGS = createScriptConfigs(templateVars)

        // Singleton to prevent duplicate script loading across multiple calls
        window.__scriptManager = window.__scriptManager || new ScriptManager()

        window.loadThirdPartyScripts = function (categories = [ScriptManager.consentCategories.ESSENTIAL], skipCookieConsent = false) {
            const scriptManager = window.__scriptManager

            if (skipCookieConsent)
                return SCRIPT_CONFIGS.forEach((config) => {
                    scriptManager.loadScript(config)
                })

            if (scriptManager && SCRIPT_CONFIGS) {
                SCRIPT_CONFIGS.forEach((config) => {
                    if (categories.includes(config.category))
                        try {
                            scriptManager.loadScript(config)
                        } catch (e) {
                            console.error("Error loading script:", e)
                        }
                })
            }
        }
    }

    window.initializeScriptManager = initializeScriptManager

y and staff.  \u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E \u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EGov. Newsom and legislative leaders have been steadfast in their support for UC, but California is still navigating serious fiscal challenges. The research bond being considered would provide the University with funding for research that advances knowledge and delivers public benefit across California.\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E  \u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWith more than a billion dollars in research funding at risk on the federal level, this is a critical moment for the state to invest in the University. \u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E \u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWill you urge your lawmakers to dedicate research bond funding for the University of California? \u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E \u003C/span\u003E\u003C/p\u003E\u0022, \u0022multi_action_ordered_children_ids\u0022: [], \u0022multi_action_parent_id\u0022: null, \u0022multiple_actions_allowed\u0022: true, \u0022name\u0022: \u0022Urge lawmakers to dedicate research bond funding for UC\u0022, \u0022navigation_bar_is_transparent\u0022: true, \u0022navigation_bar_type\u0022: 2, \u0022number_actions_count\u0022: 5602, \u0022number_actions_last_month_count\u0022: 2960, \u0022number_participants_count\u0022: 2463, \u0022number_participants_last_month_count\u0022: 1364, \u0022order\u0022: 42, \u0022page_layout_type\u0022: 1, \u u002Dheight: 1.5em\u003B\u005C\u0022\u003EDepending upon your participation in a UC Site or Service, UC may share your Personal Information internally within UC\u0027s departments and academic campuses and other UC locations. UC may also share your Personal Information with third parties. Those third parties may include:\u003C/p\u003E\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EService Providers\u003C/span\u003E: We engage other third\u002Dparty service providers that perform business or operational services for us or on our behalf. The information we share with our service providers may include contact information, demographic information, transaction information, and information about your communications and related activities.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003ECollaborators and Community Partners\u003C/span\u003E: We coordinate and share Personal Information with UC partners and collaborators to support UC\u0027s public service, education and research missions.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EPublic, Regulatory and Governmental Authorities\u003C/span\u003E: We may share Personal Information with governmental authorities that regulate or have jurisdiction over UC.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003ELegal Obligations and Rights:\u003C/span\u003E\u0026nbsp\u003BWe may disclose personal information to third parties, such as legal advisors and law enforcement:\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Ein connection with the establishment, exercise or defense of legal claims\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Eto comply with laws or to respond to lawful requests and legal process\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Eto protect our rights and property and the rights and property of others, including to enforce our agreements and policies\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Eto detect, suppress or prevent fraud\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Eto protect the health and safety of us and others\u003B or\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box_border.png\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003Eas otherwise required by applicable law.\u003C/li\u003E\u003C/ul\u003E\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EWith Your Consent:\u003C/span\u003E\u0026nbsp\u003BWe may disclose personal information about an individual to certain other third parties or publicly with their consent or direction. For example, with an individual\u0027s consent or direction we may post their testimonial on our Sites or service\u002Drelated publications.\u003C/li\u003E\u003C/ul\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EAny information acquired by UC through the Sites is subject to the limitations set forth in the Information Practices Act and any other applicable laws. The Office of the President will not distribute or share Electronically Collected Personal Information (as defined in subdivision (d) of California Government Code Section 11015.5) about users to any third\u002Dparty without the permission of the user, except in the circumstances set forth in this Statement. The Office of the President will not distribute or sell any Electronically Collected Personal Information to any third\u002Dparty without your permission. Such Electronically Collected Personal Information is exempt from requests made pursuant to the California Public Records Act (Chapter 3.5 (commencing with Section 6250) of Division 7 of Title 1). To learn more about how a particular UC unit or organization collects your Personal Information, refer to the UC website associated with that service or use the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#HTCU\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EHow to contact us\u003C/a\u003E\u0026nbsp\u003Bsection.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022RPI\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003ERetention of Personal Information\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe keep your Personal Information as long as needed or legally permitted for the purposes for which it was obtained, unless otherwise provided in agreements between you and the Office of the President or as required by law.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022HWPPI\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EHow we protect your Personal Information\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EUC takes appropriate and reasonable physical, administrative and technical safeguards to preserve the integrity and security of your personal information against loss, unauthorized access, and illegal use or disclosure. Such personal information is stored by the University in secure locations. University employees are trained on procedures for the management of Personal Information, including limitations on the release of information. Access to personal information is limited to those members of the University\u0027s staff whose work requires such access. The Office of the President\u0027s information management practices conform to the requirements of the Information Practices Act of 1977 (Civil Code Section 1798, et seq.), the Public Records Act (California Government Code Section 6250, et seq.), California Government Code Section 11015.5 and other applicable laws pertaining to information privacy.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022OCOYPI\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EYour options and control of your Personal Information\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EYou may control your information in the following ways:\u003C/p\u003E\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EEmail Communications Preferences\u003C/span\u003E. By providing us your email address, you consent to our use of your email address to send you Site and service\u002Drelated statements. You can stop receiving promotional email communications from us by clicking on the \u005C\u0022unsubscribe\u005C\u0022 link provided in such communications. You may not opt\u002Dout of service\u002Drelated communications (e.g., account verification, transactional communications, changes/updates to features of the Services, technical and security notices).\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EModifying or Deleting Your Information\u003C/span\u003E. If you have any questions about reviewing, modifying, deleting, or exercising your option of having your Personal Information deleted without reuse or distribution (pursuant to California Government Code section 11015.5), you can contact us directly by sending a written request to the postal or email address set out in the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#HTCU\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EHow to contact us\u003C/a\u003E\u0026nbsp\u003Bsection. We may take a reasonable period to respond. We may not be able to modify or delete your information in all circumstances.\u003C/li\u003E\u003C/ul\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022LTPS\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003ELinks and Third\u002DParty Sites or Services\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EOur Services may include links to third\u002Dparty websites, plug\u002Dins and applications. Except where we post, link to, or expressly adopt or refer to this Privacy Statement, this Privacy Statement does not apply to, and we are not responsible for, any Personal Information practices of third\u002Dparty websites and online services or the practices of other third parties. To learn about the Personal Information practices of third parties, please visit their respective privacy statements.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022CPI\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EChildren\u0027s Personal Information\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EExcept for students enrolled in UC programs, our Services are not directed to, and we do not intend to, or knowingly, collect or solicit Personal Information from children under the age of 13. If an individual is under the age of 13, they should not use our Services or otherwise provide us with any Personal Information either directly or by other means. If a child under the age of 13 has provided Personal Information to us, we encourage the child\u0027s parent or guardian to contact us to request that we remove the Personal Information from our systems. If we learn that any Personal Information, we collect has been provided by a child under the age of 13, we will promptly delete that Personal Information.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022UTPN\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EUpdates to our Privacy Statement\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe may update this Privacy Statement from time to time. Please review this page periodically to remain informed. Our privacy practices are current as of the Last Updated date identified at the beginning of this Statement. If we make material changes to this Privacy Statement, we will notify individuals by prominent posting on our Sites. All changes shall be effective from the date identified at the top of the page. Your continued use of the Sites after any changes in this Statement will constitute your acceptance of such change.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022ITOPI\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EInternational transfer of Personal Information\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003ETo fulfill the intended processing purposes for the UC Services you use, Personal Information of users outside of the United States, may be transferred to the United States, where data protection laws may differ from those of your home country. Depending upon your participation in or utilization of UC Services, your Personal Information may also be transferred to other countries outside of the United States. Refer to the UC website associated that UC Service or use the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#HTCU\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EHow to contact us\u003C/a\u003E\u0026nbsp\u003Bsection for more information. UC will undertake appropriate measures to ensure adequate protection of your Personal Information in accordance with applicable data protection laws.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#TOC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EBack to Table of Contents\u003C/a\u003E\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022HTCU\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EHow to contact us\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIf you have any questions or requests in connection with this Privacy Statement or other privacy\u002Drelated matters, please contact us by using the email address, postal address or telephone number:\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EChief Privacy Officer\u003Cbr\u003E\u003Ca href\u003D\u005C\u0022mailto:privacy@ucop.edu?subject\u003DPrivacy%20Question(s)\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003Eprivacy@ucop.edu\u003Cbr\u003E\u003C/a\u003E1111 Franklin Street\u003Cbr\u003EOakland, CA 94607\u003Cbr\u003E(510) 987\u002D0511\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(105, 108, 89)\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 16px\u003B text\u002Dalign: var(\u002D\u002Dbs\u002Dbody\u002Dtext\u002Dalign)\u003B\u005C\u0022\u003EStatement for European Economic Area (\u005C\u0022EEA\u005C\u0022), United Kingdom (\u005C\u0022UK\u005C\u0022) and Switzerland Residents\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EController:\u003C/span\u003E\u0026nbsp\u003BThe Regents of the University of California, a corporation established under the laws of the Constitution of the State of California, and duly incorporated and organized under the laws of United States of America, having its registered address at 1111 Franklin Street, Oakland, CA 94607, is the \u005C\u0022controller\u005C\u0022 responsible for the processing of personal data in connection with our Service. This means that we determine and are responsible for how your personal data is used.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003ELegal Bases for Processing\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EUC is the controller of the Personal Information we hold about you in connection with your use of our Services. Depending upon your relationship with UC, UC may use your Personal Information where necessary to perform its obligations under a contract with you, or where necessary to fulfil a request you have made to use or participate in a UC Service\u003B where required by law, and/or where necessary for the legitimate interests of UC, provided that there is no overriding impact on your interests or rights. In some cases, we may ask you to grant us separate consent to use your Personal Information.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003EMarketing and Advertising\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EFrom time to time, we may contact you with information about our services, including sending you marketing messages and asking for your feedback on our services. Most marketing messages we send will be by email. For some marketing messages, we may use Personal Information we collect about you, excluding your searches, to help us determine the most relevant marketing information to share with you.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe will only send you such marketing messages if you have given us your consent to do so. You can withdraw your consent any time by clicking on the unsubscribe link at the bottom of our marketing emails.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003ESecurity and Storage\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe implement appropriate technical and organizational measures to protect your personal data against accidental or unlawful destruction, loss, change or damage. We will never send you unsolicited emails or contact you by phone requesting your account ID, password, credit or debit card information or national identification numbers. International Transfers of your Personal Information\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EThe personal data we collect may be transferred to and stored in countries outside of the jurisdiction you are in where we and our third\u002Dparty service providers have operations. If you are located in the EEA, United Kingdom or Switzerland your personal data may be processed outside of those regions, including in the United States.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIn the event of such a transfer, we ensure that: (i) the personal data is transferred to countries recognized as offering an equivalent level of protection\u003B or (ii) the transfer is made pursuant to appropriate safeguards that require the recipient to treat the personal data in a manner that is essentially equivalent to that guaranteed in the country you are in. If you are located in the EEA, United Kingdom or Switzerland, these safeguards include entering into agreements that incorporate the standard contractual clauses adopted by the European Commission and approved by the UK Information Commissioner.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIf you wish to inquire further about the safeguards used, please contact us using the details set out in this Privacy Statement.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003EProfiling and Automated Decision\u002Dmaking\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe may analyse personal data we have collected about you to create a profile of your interests and preferences so that we can contact you with information that is relevant to you. We may make use of additional information about you when it is available from external sources to help us do this effectively. We may also use personal data about you to detect and reduce fraud and credit risk.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe may use your personal data for automated individual decision\u002Dmaking, in which case we will inform you of such processing activities and any potential impact of such processing activities.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003EYour Rights\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIf you are located in the EEA or the UK, you have a right to:\u003C/p\u003E\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003EAccess your Personal Information\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003ERectify or correct inaccurate or incomplete Personal Information concerning you\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003EMove your Personal Information to another controller or processor\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003EHave your Personal Information erased in certain circumstances\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003ERestrict the processing of your Personal Information in certain circumstances\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003EObject to the processing of Personal Information in certain circumstances\u003B\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003EWithdraw your consent to the processing of your Personal Information, should UC ask for your consent for the processing of your Personal Information\u003B and\u003C/li\u003E\u003C/ul\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EKnow whether your Personal Information is being used for automated decision\u002Dmaking, including profiling. In those cases, UC will give you meaningful information about the logic involved, the significance and the envisaged consequences of such processing for your data, and the right to request human intervention\u003B\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EYou also have the right to object to any processing based on our legitimate interests where there are grounds relating to your particular situation. There may be compelling reasons for continuing to process your personal data, and we will assess and inform you if that is the case. You can object to marketing activities for any reason. Due to the confidential nature of data processing, we may ask you to confirm your identity when exercising the above rights.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIf you wish to exercise one of these rights, please email us at:\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022mailto:privacy@ucop.edu?subject\u003DPrivacy%20Question(s)\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003Eprivacy@ucop.edu\u003C/a\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EYou also have the right to lodge a complaint to your local data protection authority. If you are based in the European Union,\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://ec.europa.eu/newsroom/article29/items/612080/en\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003Einformation about how to contact your local data protection authority is available online\u003C/a\u003E. If you are based in the UK or Switzerland, your local data protection authorities are the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://ico.org.uk/global/contact\u002Dus/\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EUK Information Commissioner\u0027s Office\u003C/a\u003E\u0026nbsp\u003Band the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.edoeb.admin.ch/en/contact\u002D2\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003ESwiss Federal Data Protection and Information Commissioner\u003C/a\u003E.\u003C/p\u003E\u003Ch3 style\u003D\u005C\u0022margin\u002Dtop: 2em\u003B margin\u002Dbottom: 1em\u003B color: rgb(105, 108, 89)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 1.3em\u003B font\u002Dsize: 16px\u003B font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003ECookie Statement\u003C/h3\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWhere permitted by law, non\u002Dpersonally identifiable information and Personal Information may be automatically collected through the standard operation of UC\u0027s Internet service or through the use of \u005C\u0022cookies\u005C\u0022 or \u005C\u0022internet tags\u005C\u0022 and other similar techniques. Refer to the appropriate section for more information on\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.ucop.edu/privacy\u002Dstatement/index.html#RC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003Ehow to restrict cookies\u003C/a\u003E.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe and our third\u002Dparty partners and providers may use cookies to automatically collect certain types of usage information when you visit or interact with our email communications and Services. For example, we may collect log data about your device and its software, such as your IP address, operating system, browser type, date/time of your visit and other similar information. Our emails may also contain tracking pixels that identify if and when you have opened an email that we have sent you, how many times you have read it and whether you have clicked on any links in that email. We may also collect analytics data or use third\u002Dparty analytics tools to help us measure usage and activity trends for our online services and better understand the individuals using our services. We also may collect location data, including general geographic location based on IP address.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EUC may use three types of cookies:\u003C/p\u003E\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EEssential Cookies\u003C/span\u003E: These are placed on your computer to let our Site function as intended, by allowing the pages to display correctly. Without these, our Site would be prevented from working and would be unusable.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EPreferences \u0026amp\u003B Functionality Cookies\u003C/span\u003E: These cookies allow our Site to remember how it behaves or looks based on your preferences (e.g., your preferred language or the region you are in). These cookies can also assist you in changing text size and font and allow you to personalize the pages based on your preferences. These cookies help enhance your experience and disabling these cookies may make our Site less functional\u003B disabling these cookies, however, should not prevent our Site from working.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003EThird\u002DParty Analytics Cookies\u003C/span\u003E: The only third\u002Dparty cookies we use are analytics cookies. The use of analytics cookies allows us to improve the Site and enhance user experience. The analytics cookies set on your browser allow us to recognize and count the number of users to the website, see when users are using the Site, and see how users interact with the Site and its different functions. Analytics cookies show us which of the Site pages are most frequently viewed and help us record any difficulties you have with the Site.\u003C/li\u003E\u003C/ul\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe may include or engage in the following as part of our Services:\u003C/p\u003E\u003Cul style\u003D\u005C\u0022padding: 0px\u003B margin\u002Dright: 0px\u003B margin\u002Dleft: 10px\u003B list\u002Dstyle: none\u003B line\u002Dheight: 21px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B\u005C\u0022\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003ESocial Media Widgets\u003C/span\u003E: Our Services may include social media features, such as the Facebook \u005C\u0022Like\u005C\u0022 button, Pinterest, Instagram, Twitter or other widgets. These social media companies may recognize you and collect information about your visit to our Services, and they may set a cookie or employ other tracking technologies. Your interactions with those features are governed by the privacy policies of those companies.\u003C/li\u003E\u003Cli style\u003D\u005C\u0022line\u002Dheight: 1.5em\u003B background: url(\u0026quot\u003B../img/icon_grn_box.gif\u0026quot\u003B) 0px 12px no\u002Drepeat\u003B padding: 5px 0px 5px 15px\u003B\u005C\u0022\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dfamily: KievitProBld, Arial, Helvetica, sans\u002Dserif\u003B\u005C\u0022\u003ESocial Media Platforms\u003C/span\u003E: We may display targeted advertising to you through social media platforms, such as Facebook, Twitter, Instagram, LinkedIn and other social media forums. These companies have interest\u002Dbased advertising programs that allow us to direct advertisements to users who have shown interest in our services while those users are on the social media platform, or to groups of other users who share similar traits, such as likely commercial interests and demographics. We may share a unique identifier, such as a user ID, with these platform providers or they may collect information from our website visitors through a first\u002Dparty pixel, in order to direct targeted advertising to you or to a custom audience on the social media platform. These advertisements are governed by the privacy policies of those social media companies that provide them. If you do not want to receive targeted ads on your social networks, you may be able to adjust your advertising preferences through your settings on those networks.\u003C/li\u003E\u003C/ul\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe also work with a variety of third\u002Dparty partners to provide analytics and advertising services. For example, we use Google Analytics to recognize you and link the devices you use when you visit our Services on your browser or mobile device, log in to your account on our Services or otherwise engage with us. We share a unique identifier, like a user ID, with Google to facilitate the service. Google Analytics allows us to better understand how our users interact with our Services and to tailor our advertisements and content to you. For information on how Google Analytics collects and processes data, as well as how you can control information sent to Google, review Google\u0027s website, \u005C\u0022\u003Ca href\u003D\u005C\u0022https://www.google.com/policies/privacy/partners/\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EHow Google uses data when you use our partners\u0027 sites or apps\u003C/a\u003E.\u005C\u0022\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EYou can learn about Google Analytics\u0027 currently available opt\u002Douts, including the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://tools.google.com/dlpage/gaoptout/\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EGoogle Analytics Browser Add\u002DOn\u003C/a\u003E.\u003C/p\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EWe may also utilize certain forms of display advertising and other advanced features through Google Analytics. These features enable us to use first\u002Dparty cookies (such as the Google Analytics cookie) and third\u002Dparty cookies (such as the DoubleClick advertising cookie) or other third\u002Dparty cookies together to inform, optimize and display ads based on your past visits to the Services. You may control your advertising preferences or opt\u002Dout of certain Google advertising products by visiting the\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://google.com/ads/preferences\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EGoogle Ads Preferences Manager\u003C/a\u003E, or by visiting\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.networkadvertising.org/choices\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003ENAI\u0027s online resources\u003C/a\u003E.\u003C/p\u003E\u003Ch4 style\u003D\u005C\u0022color: rgb(51, 51, 51)\u003B text\u002Drendering: auto\u003B line\u002Dheight: 18px\u003B font\u002Dsize: 14px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B text\u002Dtransform: uppercase\u003B\u005C\u0022\u003E\u003Ca id\u003D\u005C\u0022RC\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003E\u003C/a\u003EHow to restrict cookies\u003C/h4\u003E\u003Cp style\u003D\u005C\u0022margin\u002Dbottom: 15px\u003B font\u002Dfamily: KievitProBook, Arial, Helvetica, sans\u002Dserif\u003B font\u002Dsize: 14px\u003B line\u002Dheight: 1.5em\u003B\u005C\u0022\u003EIf you would prefer not to accept cookies, most browsers will allow you to: (i) change your browser settings to notify you when you receive a cookie, which lets you choose whether or not to accept it\u003B (ii) disable existing cookies\u003B or (iii) set your browser to automatically reject cookies\u003B however, doing so may negatively impact your experience using the services, as some features and services may not work properly. You may also set your email options to prevent the automatic downloading of images that may contain technologies that would allow us to know whether you have accessed our email and performed certain functions with it. Alternatively, you may wish to visit\u0026nbsp\u003B\u003Ca href\u003D\u005C\u0022https://www.aboutcookies.org/\u005C\u0022 style\u003D\u005C\u0022color: rgb(68, 71, 81)\u003B text\u002Ddecoration\u002Dline: underline\u003B\u005C\u0022\u003EAbout Cookies\u003C/a\u003E, which contains comprehensive information on how to do this on a wide variety of desktop browsers.\u003C/p\u003E\u003C/div\u003E\u0022}, \u0022widgetType\u0022: 4}], \u0022requires_login\u0022: false, \u0022widget_layout_type\u0022: 1, \u0022custom_javascript\u0022: \u0022\u0022, \u0022custom_css\u0022: \u0022\u0022, \u0022disclaimer_text\u0022: \u0022\u0022, \u0022use_page_region\u0022: false, \u0022can_access\u0022: true, \u0022cannot_access_message\u0022: null}, {\u0022id\u0022: 5696, \u0022archived\u0022: false, \u0022name\u0022: \u0022Home Page\u0022, \u0022action_center\u0022: 2646, \u0022path\u0022: \u0022/\u0022, \u0022title\u0022: \u0022\u0022, \u0022page_restriction_type\u0022: 1, \u0022widgets\u0022: [{\u0022props\u0022: {\u0022title\u0022: \u0022Thank you for being a part of the UC Advocacy Network!\u0022, \u0022content\u0022: \u0022\u003Cdiv\u003ECheck out our other priorities to see how you can help!\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E 0022: \u0022\u0022, \u0022internal_only_name\u0022: \u0022May Research Bond Petition\u0022, \u0022is_custom_targeting_enabled\u0022: true, \u0022is_one_click_registration_enabled\u0022: true, \u0022logo_override_url\u0022: \u0022\u0022, \u0022long_description\u0022: \u0022\u003Cp\u003EThe state legislature and Governor Newsom are considering the California Science and Health Research Bond Act, and it\u005Cu2019s a historic opportunity for the state to invest in the University of California.\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003ENever in its 158\u002Dyear history has the University of California faced the kind of fiscal uncertainty that it does today. UC\u005Cu2019s systemic budget challenges include rising operating costs, state fiscal constraints and numerous federal actions that directly affect our research mission, and support for students, faculty and staff.\u005Cu00a0\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EGov. Newsom and legislative leaders have been steadfast in their support for UC, but California is still navigating serious fiscal challenges. The research bond being considered would provide the University with funding for research that advances knowledge and delivers public benefit across California.\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWith more than a billion dollars in research funding at risk on the federal level, this is a critical moment for the state to invest in the University.\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWill you tell Governor Newsom to dedicate research bond funding for the University of California?\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u0022, \u0022multi_action_ordered_children_ids\u0022: [], \u0022multi_action_parent_id\u0022: null, \u0022multiple_actions_allowed\u0022: false, \u0022name\u0022: \u0022Tell Governor Newsom: Fund UC research\u0022, \u0022navigation_bar_is_transparent\u0022: true, \u0022navigation_bar_type\u0022: 2, \u0022number_actions_count\u0022: 1, \u0022number_actions_last_month_count\u0022: 1, \u0022number_participants_count\u0022: 1, \u0022number_participants_last_month_count\u0022: 1, \u0022order\u0022: 43, \u0022page_layout_type\u0022: 1, \u0022personalized_campaign_pages\u0022: {}, \u0022pos_message\u0022: \u0022\u0022, \u0022pos_subject\u0022: \u0022\u0022, \u0022rate_limit\u0022: null, \u0022registration_page\u0022: \u0022/api/grassrootsregistrationpage/12660/\u0022, \u0022regulation_id\u0022: null, \u0022required_video_link\u0022: \u0022\u0022, \u0022resource_uri\u0022: \u0022/api/grassrootscampaign/161603/\u0022, \u0022share_story_type\u0022: 1, \u0022share_story_video_duration\u0022: 60, \u0022short_description\u0022: \u0022\u0022, \u0022should_rework_with_ai\u0022: false, \u0022should_use_footer_html\u0022: true, \u0022show_num_actions\u0022: false, \u0022show_num_supporters\u0022: true, \u0022single_body_for_all_messages\u0022: false, \u0022statistics\u0022: null, \u0022stats_last_updated_at\u0022: \u00222026\u002D04\u002D28T16:00:23.137432\u0022, \u0022status\u0022: 2, \u002 nstraints and numerous federal actions that directly affect our research mission, and support for students, faculty and staff.\u005Cu00a0\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EGov. Newsom and legislative leaders have been steadfast in their support for UC, but California is still navigating serious fiscal challenges. The research bond being considered would provide the University with funding for research that advances knowledge and delivers public benefit across California.\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E\u005Cu00a0\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWith more than a billion dollars in research funding at risk on the federal level, this is a critical moment for the state to invest in the University.\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003EWill you urge your lawmakers to dedicate research bond funding for the University of California?\u005Cu00a0\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 12pt\u003B line\u002Dheight: 20.5042px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u0022, \u0022multi_action_ordered_children_ids\u0022: [], \u0022multi_action_parent_id\u0022: null, \u0022multiple_actions_allowed\u0022: true, \u0022name\u0022: \u0022Urge lawmakers to dedicate research bond funding for UC\u0022, \u0022navigation_bar_is_transparent\u0022: true, \u0022navigation_bar_type\u0022: 2, \u0022number_actions_count\u0022: 5602, \u0022 \u0022gamification_points_mode\u0022: 1, \u0022id\u0022: 155690, \u0022inbound_texting_reply_message\u0022: \u0022\u0022, \u0022internal_only_name\u0022: \u0022March 2026 State Budget Campaign\u0022, \u0022is_custom_targeting_enabled\u0022: true, \u0022is_one_click_registration_enabled\u0022: false, \u0022logo_override_url\u0022: \u0022\u0022, \u0022long_description\u0022: \u0022\u003Cp\u003E\u003Cspan\u003ECalifornia is once again facing a challenging budget year. With a \u003Cstrong\u003Emulti\u002Dbillion\u002Ddollar state deficit\u003C/strong\u003E projected for the coming fiscal year, the Governor and Legislature are confronting difficult funding decisions that will shape the future of our state.\u005Cu00a0\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 17.2667px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EStarting in 2022, through the Compact \u005Cu2014 a negotiated agreement between the University of California, Governor Gavin Newsom, and the Legislature \u005Cu2014 UC has received state funding specifically intended to expand enrollment for California students. UC has exceeded the Compact\u005Cu2019s goals and is serving more California students than ever before. This investment has increased access, kept college affordable, and supported success for thousands of Californians. The Compact reflects a shared promise from the state and the University to grow opportunity and strengthen California\u005Cu2019s future.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dsize: 11pt\u003B line\u002Dheight: 17.2667px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EIn his proposed 2026\u005Cu201327 budget, Governor Newsom reaffirmed his commitment to higher education and to the University of California. The proposal takes an important step by providing a portion of previously deferred Compact funding, fully funding the final year of the Compact, and provides loan authority to help stabilize UC\u005Cu2019s base budget as we continue to serve a record 301,000 students. Loan authority helps UC navigate delayed payments, but fully honoring the Compact remains essential.\u005Cu00a0\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 17.2667px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EThe Legislature has now begun formal budget hearings, and decisions in the months ahead will shape how well UC can serve its students. \u003Cstrong\u003EYou\u005Cu2019ve done it before: last year, this community sent 18,000 emails and helped protect UC\u005Cu2019s funding.\u003C/strong\u003E\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 17.2667px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EEffective advocacy is a long game. Budget decisions in one year shape funding the next, which is why consistency and collective action matter. We need your help urging lawmakers to \u003Cstrong\u003EKeep the Promise, Fund the Compact\u003C/strong\u003E. Honor their commitments and invest in the students, discoveries, and communities that depend on the University of California.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 17.2667px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003E\u003Cstrong\u003EAs we move forward, we need your voice.\u005Cu00a0\u003C/strong\u003E\u003C/span\u003E\u0 nConfig)\u003B\u005Cn      }\u005Cn      let loggedInForm \u003D editLoggedInFind()\u003B\u005Cn      if (loggedInForm) {\u005Cn        editContainerObserver.disconnect()\u003B\u005Cn        editLoggedInMessage(loggedInForm)\u003B\u005Cn        editContainerObserver.observe(editActionContainer, editMutationConfig)\u003B\u005Cn      }\u005Cn      let thankYouH4 \u003D editThanksH4Find()\u003B\u005Cn      if (thankYouH4) {\u005Cn        editContainerObserver.disconnect()\u003B\u005Cn        editThanksH4(thankYouH4)\u003B\u005Cn        editContainerObserver.observe(editActionContainer, editMutationConfig)\u003B\u005Cn      }\u005Cn    },\u005Cn    editContainerObserver \u003D new MutationObserver(editMutationCallback),\u005Cn    editMutationConfig \u003D {attributes: true, characterData: true, childList: true, subtree: true }\u003B\u005CneditContainerObserver.observe(editActionContainer, editMutationConfig)\u003B\u005CneditMutationCallback()\u003B\u005Cn\u0022, \u0022custom_target\u0022: \u0022\u0022, \u0022custom_thank_you_javascript\u0022: \u0022\u0022, \u0022description_alignment_type\u0022: 1, \u0022facebook_leadgen_form_id\u0022: \u0022\u0022, \u0022facebook_leadgen_form_questions\u0022: null, \u0022fixed_post_message\u0022: \u0022\u0022, \u0022fixed_post_message_two\u0022: \u0022\u0022, \u0022fixed_pre_message\u0022: \u0022\u0022, \u0022fixed_pre_message_two\u0022: \u0022\u0022, \u0022footer_html\u0022: \u0022\u0022, \u0022full_bleed_header_image_alt_text\u0022: \u0022\u0022, \u0022full_bleed_header_image_contain\u0022: false, \u0022full_bleed_header_image_url\u0022: \u0022\u0022, \u0022full_bleed_header_text_is_left_aligned\u0022: true, \u0022full_bleed_header_type\u0022: 1, \u0022full_bleed_header_video_url\u0022: \u0022\u0022, \u0022gamification_points_mode\u0022: 1, \u0022id\u0022: 152450, \u0022inbound_texting_reply_message\u0022: \u0022\u0022, \u0022internal_only_name\u0022: \u0022\u0022, \u0022is_custom_targeting_enabled\u0022: true, \u0022is_one_click_registration_enabled\u0022: true, \u0022logo_override_url\u0022: \u0022\u0022, \u0022long_description\u0022: \u0022\u003Cp\u003E\u003Cspan\u003ECalifornia is once again facing a challenging budget year. With a \u003Cstrong\u003Emulti\u002Dbillion\u002Ddollar state deficit\u003C/strong\u003E projected for the coming fiscal year, the Governor and Legislature are confronting difficult funding decisions that will shape the future of our state.\u005Cu00a0\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003ESupporting and protecting our state\u005Cu2019s higher education institutions is more important than ever. Year after year, the state has made a promise to invest in the UC system \u002D a partnership that has expanded access, kept college affordable, and supported success for thousands of California students.\u005Cu00a0\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003ELast year showed how difficult it can be to uphold those commitments during periods of deep fiscal uncertainty.\u005Cu00a0\u005Cu00a0\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EAt the start of the 2025\u005Cu201326 budget process, the University of California faced a proposed\u005Cu202f\u003Cstrong\u003E8% cut to its base budget\u003C/strong\u003E\u005Cu202f\u005Cu2014 a reduction that would have had immediate and lasting impacts on students, faculty, and campuses statewide. Through sustained advocacy by UC leaders, students, alumni, faculty, staff, and supporters across California, that proposal changed.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EInstead of an ongoing cut, the final budget delayed rather than eliminated 3% of UC\u005Cu2019s base budget. The state also\u005Cu202f\u003Cstrong\u003Epostponed, but did not cut, the Compact \u003C/strong\u003Ewhich is\u003Cstrong\u003E \u003C/strong\u003Etied to UC\u005Cu2019s required enrollment growth. We remain grateful that the Legislature and Governor chose to avoid deep cuts. However, costs are rising as UC has met its enrollment targets, and this year, we need the state to continue fulfilling its promise.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EIn his proposed 2026\u005Cu201327 budget, Gavin Newsom reaffirmed his commitment to higher education and to the University of California. The proposal takes an important step by providing a portion of previously deferred Compact funding, fully funding the final year of the Compact, and supporting our base budget through loan authority that ensures UC has the temporary fiscal support to continue serving a record 301,000 students.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EThis proposal is a strong start. Fully honoring that commitment will be essential as costs rise and federal action continues to threaten the stability of higher education. The Legislature has yet to weigh in, and the months ahead will bring difficult negotiations. Stable, predictable funding remains essential to expanding access and affordability.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003EEffective advocacy is a long game. It takes consistency and collective action. As the budget process moves forward, we will be urging lawmakers to \u003Cstrong\u003EKeep the Promise, Fund the Compact\u003C/strong\u003E\u005Cu2014to honor their commitments and invest in the students, discoveries, and communities that depend on the University of California.\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u003Cp style\u003D\u005C\u0022text\u002Dalign: left\u005C\u0022\u003E\u003Cspan\u003E\u003Cstrong\u003EAs we move forward, we need your voice. Can we count on you to advocate for UC?\u003C/strong\u003E\u003C/span\u003E\u003Cspan style\u003D\u005C\u0022color: rgb(0, 0, 0)\u003B font\u002Dsize: 11pt\u003B line\u002Dheight: 18.3458px\u005C\u0022\u003E\u005Cu00a0\u003C/span\u003E\u003C/p\u003E\u0022, \u0022multi_action_ordered_children_ids\u0022: [], \u0022multi_action_parent_id\u0022: null, \u0022multiple_actions_allowed\u0022: false, \u0022name\u0022: \u0022Protect California\u005Cu2019s investment in UC\u0022, \u0022navigation_bar_is_transparent\u0022: true, \u0022navigation_bar_type\u0022: 2, \u0022number_actions_count\u0022: 61, \u0022number_actions_last_month_count\u0022: 0, \u0022number_participants_count\u0022: 61, \u0022number_participants_last_month_count\u0022: 0, \u0022order\u0022: 37, \u0022page_layout_type\u0022: 1, \u0022personalized_campaign_pages\u n, discover life\u002Dsaving solutions, and strengthen our nation.\u003C/p\u003E\u003Cp\u003EBut right now, that future is at stake.\u003C/p\u003E\u003Cp\u003EThe federal government\u005Cu2019s unprecedented demand of $1 billion from UCLA would be devastating. It would mean cutting off life\u002Dsaving care, reducing educational access, and halting tech and economic growth for California and the nation\u005Cu2014because UC\u005Cu2019s impact reaches beyond our classrooms and labs.\u003C/p\u003E\u003Cp\u003EThis is why your story matters, and why we need you to Stand Up for UC! Help us show what makes UC special, and why protecting its future matters to all Americans.\u003C/p\u003E\u003Cp\u003E\u003Cstrong\u003EWhat to Share\u003C/strong\u003E\u003C/p\u003E\u003Cp\u003EWe want to know what the University has done for you and why you are standing up for UC!\u003C/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cp\u003E\u003Cstrong\u003EStudents: \u003C/strong\u003EWhy are you concerned about cuts to federal research funding? What do you study? What are you involved with on campus? How has this shaped your UC experience?\u003C/p\u003E\u003C/li\u003E\u003Cli\u003E\u003Cp\u003E\u003Cstrong\u003EStaff or faculty:\u003C/strong\u003E What inspires you working at UC? What kind of impact does UC enable you to have on your students, the campus community, and your field?\u003C/p\u003E\u003C/li\u003E\u003Cli\u003E\u003Cp\u003E\u003Cstrong\u003EResearchers:\u003C/strong\u003E What accomplishments have you achieved at UC? How will the impact of the federal government\u005Cu2019s decisions harm your work and halt your progress?\u003C/p\u003E\u003C/li\u003E\u003Cli\u003E\u003Cp\u003E\u003Cstrong\u003EAlumni: \u003C/strong\u003EHow has UC shaped your life, your path, and your career?\u003C/p\u003E\u003C/li\u003E\u003Cli\u003E\u003Cp\u003E\u003Cstrong\u003EParent or family member:\u003C/strong\u003E How has the UC experience impacted your family member?\u003C/p\u003E\u003C/li\u003E\u003Cli\u0                 const cookiesEnabled = document.cookie.indexOf("third_party_test_cookie=1") !== -1;
                document.cookie = "third_party_test_cookie=; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure";
                return !cookiesEnabled;
            } catch (e) {
                return true;
            }
        }

        const cookielessSafariWindow = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) && document.cookie === "";
        const registrationForm = window.location.pathname.indexOf('/sign_up/') > -1;
        const cookiesDisabled = areThirdPartyCookiesDisabled();

        // if we're in an iframe & crossorigin & the browser is safari & the page is not a registration form
        if (inIframe() === "crossorigin" && cookielessSafariWindow && !registrationForm) {
            window.cookielessSafari = true
        }

        if (cookiesDisabled && inIframe() === "crossorigin") {
            window.cookielessEmbedded = true
            window.cookielessAuth = true
        }

        if (!window.is_supporter_authenticated) {
            localStorage.removeItem("userdata")
        }
