  <header>
    
            <h2 class="node__title">
        <a href="/sustainability/news/recap-ucsfs-vibrant-earth-month-activities" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">A Recap of UCSF&#039;s Vibrant Earth Month Activities</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10706" hreflang="en">SustAwards2026-153.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>This year UCSF celebrated Earth Day all month long. With lots of activities planned, from a<br>Sustainability Themed Bingo Card to an outdoor Yoga Flow Session, staff were encouraged<br>to participate in events that emphasized mindfulness and sustainability. Every Earth Month, the Sustainability Team is hard at work planning events for staff, students, and faculty alike.</p><h2 class="text-h3"><br>Here is a quick recap of the events:</h2><img data-entity-uuid="8fb486c9-c8fe-4245-adae-1f9aa13b34a1" data-entity-type="file" alt="Three people stand behind a table with informational materials and stickers" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Tabling.jpg.webp?itok=lcesXW7y" width="1208" height="1126" class="image-style-full-size-width-1208"><h3 class="text-h4"><br>1. Earth Week Tabling</h3><p>All week long, the UCSF Sustainability Team, along with partners from Recology and Stanyan’s Green Team, tabled across the five hospital sites: Mission Bay Medical Center, Parnassus Heights, Mount Zion Medical Center, and Hyde and Stanyan Hospitals. During these tabling sessions, the team provided waste sorting games, fun trivia questions, stickers, and more! The team had about 132 visitor engagements and got to answer any questions staff may have.</p><h3 class="text-h4"><br>2. Earth Month Bingo Card</h3><p>UCSF Health Sustainability Team made a Bingo Card that lasted all month long in honor of Earth Month. Some of the actions included “eat plant based for a day”, “reuse a single-use item”, or “take a screen break outside.” For a chance to win a sustainable prize, participants had to send in a completed bingo card as well as a picture of them completing one of the challenges. The<br>winners received a sustainable prize package, which included seeds, seed shakers,<br>and stasher bags. This challenge hopefully made staff more aware of sustainability<br>actions they can take in their everyday lives, making everyday Earth Day!</p><h3 class="text-h4"><img data-entity-uuid="475e5a15-3402-404b-9639-acd079efe53a" data-entity-type="file" alt="Sustainability team members stand next to the Waste to Art welcome banner." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/W2ADSC_0259.JPG.webp?itok=RbxKfzPq" width="1208" height="806" class="image-style-full-size-width-1208"></h3><h3 class="text-h4">3. Waste to Art Exhibition</h3><p>The Waste to Art Exhibition took place on April 14th and was a big success! Waste to Art is UCSF’s annual challenge dedicated to transforming waste, including medical and laboratory waste, into incredible, and inspiring art pieces. UCSF community members made an art piece of their choosing, and these pieces were showcased at the Waste to Art Exhibition. The beginning of the day was open to the public, where viewers surveyed the art and voted for their favorite pieces. Later in the day, from 3 to 4 p.m., followed a ceremony where the winners were announced and celebrated.</p><img data-entity-uuid="9d28d55c-4477-4906-bdb3-c721c7b5ef05" data-entity-type="file" alt="Two women stand in front of a quilted art piece" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0293%20%281%29.JPG.webp?itok=vuvXEjrT" width="1208" height="806" class="image-style-full-size-width-1208"><p>In first place was “Birth and Rebirth: Black Maternal Mortality Explored Through the Quilting Tradition” by Isabel Alves de Lima with Leah Pimentel, MBA and Charlene Blake, MD. They made a quilt constructed from medical textiles recovered from the Parnassus Operating room, including scrub caps, bunny suits, and disposable scrub jackets. The ‘Bricklayer’ quilt pattern is inspired by the Gee’s Bend quiltmakers, "a group of women and their ancestors from the Gee’s Bend area of Alabama’s rural Black Belt, whose quilts are celebrated as some of the most significant artistic contributions to American art history." An image of a birthing mother made of braided strips of material is shown, representing Black maternal mortality during childbirth.&nbsp;</p><img data-entity-uuid="17d95931-ab7f-42a3-a88b-49bba2418592" data-entity-type="file" alt="woman holds laptop and envelope with 2nd place ribbon" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0299.JPG.webp?itok=7l2QG16W" width="1208" height="860" class="image-style-full-size-width-1208"><p>In second place, was “<a href="https://www.youtube.com/watch?v=x3r_Z392WSo">Video</a>: Ecolectivos art competition with women from Santa Maria Xalapán, Jalapa, Guatemala” by Lisa M Thompson, Professor, School of Nursing, UCSF. This Waste to<br>Art video shows women who participated in a recycled plastic art contest. Thompsons’ team is also conducting a research project in rural Guatemala known as Ecolectivos, where they work with rural Xinca indigenous communities who are taking steps to reduce the burning of plastic waste in household cooking and trash fires, through encouraging repurposing plastic.&nbsp;</p><img data-entity-uuid="ad59cce3-b3d1-4b6c-b894-0049405d6e9b" data-entity-type="file" alt="Woman holds artwork shaped like a mouth with dental devices inside." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-175%20%281%29.jpg.webp?itok=J9pB6AoZ" width="1208" height="921" class="image-style-full-size-width-1208"><p>And in third place was, “Mouth of the Earth,” by Priyanka Suri, UCSF School of Dentistry Student. Mouth of the Earth confronts the often-unseen environmental cost of modern healthcare through the lens of dentistry. The sculpture is of the Earth, depicted as an open mouth,<br>representing our constant consumption and accumulation in nature. The sculpture<br>is constructed entirely from discarded dental materials, including blue nitrile gloves,<br>green rubber dam sheets, and layers of reclaimed boxing and beading wax molded<br>into exaggerated dentition. Mouth of the Earth is not only a reflection of current<br>realities, but also a call to action! Thank you to all our participants, winners, judges,<br>and sustainability team for putting this together!</p><img data-entity-uuid="4aa96321-c4c4-4ceb-8d38-3beb8553301b" data-entity-type="file" alt="Award recipients pose with Chancellor Hawgood" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-168%20%282%29.jpg.webp?itok=QywLFW9k" width="1208" height="755" class="image-style-full-size-width-1208"><h3 class="text-h4">4. UCSF Annual Sustainability Celebration</h3><p>The Annual Sustainability Awards Celebration took place on April 15th, honoring the hard work of notable UCSF community members’ contributions to sustainability efforts. We heard from key<br>speakers including Chief Sustainability Officer, Kira Stoll, and Chancellor, Sam Hawgood. Guests were served sustainable food from Moffit Catering Services on reusable dishware from Dispatch Goods, making it a zero-waste event. At the event, students, staff, and faculty sustainability advocates gathered to share community achievements and honor the 2026 UCSF Sustainability Award recipients in a recognition ceremony. The awardees are leading the way through unique efforts and impactful actions.&nbsp;</p><p>Congratulations to all sustainability award recipients: Pranay Narang, M.S. and Third-Year Medical Student; Laura Weil, CNM, NP, MPH; Hilary Ong, MD, FAAP, DCM; Matt Richardson, DPT; Ramneek Rai, DDS; Christy Carillo, CDM, CFPP; Mel Maxwell, Executive Director, Supply Chain Management – Logistics; and the UCSF Health Interdepartmental Team consisting of Energy Management, Facilities Operations, and Real Estate!</p><h3 class="text-h4"><br>5. Yoga Session</h3><p>UCSF Health Sustainability partnered with the Native American Health Alliance to hold a gentle yoga flow to celebrate Earth Month. It was led by Sapphire Persinger, a Clinical Research Coordinator at UCSF and certified yoga instructor. During the event, we set intentions of sustainability and mindfulness. The sustainability team was also tabling before and after the event, to inform staff on the importance of Earth Month and Sustainability.</p><h3 class="text-h4"><br>6. E-Waste</h3><p>UCSF Sustainability Teams held two e-waste events at Parnassus Heights<br>Hospital and Mission Bay Medical Center. Staff were onsite collecting unwanted electronics and had 25 participants at the Mission Bay Event and 58 participants at Parnassus Heights.</p><h3 class="text-h2 text-h4"><br>7. BCH Oakland Litter Pickup&nbsp;</h3><p>Members of the Oakland Green Team participated in a<br>litter cleanup on Friday, April 24th. For more information or any questions email: <a href="mailto:ucsfhealthsustainability@ucsf.edu">ucsfhealthsustainability@ucsf.edu</a></p></div>

<article data-history-node-id="15716" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/sustainability/news/ucsf-recognizes-2026-annual-sustainability-awards-recipients" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">UCSF Recognizes the 2026 Annual Sustainability Awards Recipients </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10701" hreflang="en">SustAwards2026-168 (1).jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Excitement was high as members of the UCSF community gathered for the Annual Sustainability Celebration hosted by the Office of Sustainability.</p><p>A focal point of the celebration is the Annual Sustainability Awards, sponsored by the UCSF Advisory Committee on Sustainability, which honor those who go above and beyond their role descriptions and take on the challenge of cleaning up the environment.</p><p>This year, UCSF recognized seven individuals and one team for making extraordinary contributions to sustainability across its campuses.</p><p>Chief Sustainability Officer Kira Stoll opened the event with reflections on the teams and individuals advancing sustainability across UCSF and highlighting how this work continues to expand across campuses, labs, and clinical care.</p><p>Chancellor Sam Hawgood, Sheila Antrum, RN MHSA, Senior Vice President and COO, UCSF Health and Erin Gore, Senior Vice Chancellor, Finance and Administration, were present to honor the awardee and spoke to the importance of their dedication to the environment.</p><blockquote><p><br>“What we see in today’s awardees is that climate action is not theoretical. It takes shape in very concrete ways. Reducing waste. Improving building performance. Rethinking prescribing practices. Advancing sustainable food systems. Transitioning to low-emissions transportation,” Hawgood said in his remarks. “Collectively, these efforts are helping to build a culture of sustainability at UCSF, one where environmental stewardship strengthens patient care, education, and operations.”</p></blockquote><img data-entity-uuid="2a00d971-7dde-4670-8fef-415cf2f71fa4" data-entity-type="file" alt="Chancellor Sam Hawgood speaks at a podium in front of a crowd." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-116%20%281%29.jpg.webp?itok=6EHGaBn8" width="1208" height="755" class="image-style-full-size-width-1208"><blockquote><p><br>““Across our multiple sites, sustainability is becoming part of how we deliver care. It is reflected in how we manage resources and operate our clinical environments. It requires teams who are willing to rethink processes and coordinate across roles and disciplines to drive meaningful change,” Antrum said in her remarks.</p><p>&nbsp;</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Sheila Antrum gives her introduction to the awardees from behind a podium." data-entity-type="file" data-entity-uuid="cf68d015-a3f4-4f2d-9c1a-50ee44c38588" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-117.jpg.webp?itok=2xOJydxR" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Sheila Antrum introduces several awardees and shares her appreciation for their efforts.</figcaption>
</figure>
<p>Attendees got to try out reusable containers from Dispatch Goods, who is partnering with UCSF Nutrition and Food Services to bring more sustainable dining options to UCSF. Guests also had the opportunity to adopt native plants from Sutro Stewards, a volunteer organization who work alongside UCSF forestry technicians to take care of the Mount Sutro Open Space Reserve.</p><figure role="group" class="caption caption-img">
<img alt="Chancellor Sam Hawgood stands infront of artwork made of reused materials." data-entity-type="file" data-entity-uuid="43e87801-ea60-4305-89e6-ed0e20f95af5" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-132.jpg.webp?itok=ldeXcEs1" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Chancellor Sam Hawgood admires the submissions from this year's Waste to Art challenge.&nbsp;</figcaption>
</figure>
<p>In addition to the award recipients, the celebration honored all offices, labs, clinics/units, and event planners who have completed the <a href="https://campuslifeserviceshome.ucsf.edu/sustainability/sustainability-certifications">Sustainability Certification Program </a>and the winners of the<a href="https://campuslifeserviceshome.ucsf.edu/sustainability/waste-art"> 2026 Waste to Art challenge.</a>&nbsp;</p><p>The event captured a sense of inspiration and hope, as well as a renewed responsibility to consider how our daily work impacts the environment.&nbsp;</p><blockquote><p><br>“Sustainability is increasingly embedded in this work. It shapes how we design, operate, and manage our physical environment and administer programs. Advancing decarbonization at scale requires this kind of systems-level focus. It means improving building performance, reducing reliance on fossil fuels, and integrating sustainability into both long-term planning and project delivery,” Gore said in her remarks.</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Erin Gore shakes Mel Maxwell's hand in front of a podium. " data-entity-type="file" data-entity-uuid="d9882b45-3319-44af-9204-77d22875a64d" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-122.jpg.webp?itok=Cl-RzJT6" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Erin Gore congratulates Mel Maxwell on his Sustainability Award.</figcaption>
</figure>
<h2>Meet the Awardees</h2><p>▶ <strong>Watch the awardee highlights video.</strong>&nbsp;</p><p><iframe src="//www.youtube.com/embed/koNweSWG-M0?si=1Hrjx5VL-xUX3cI-&quot; title=&quot;YouTube video player&quot; frameborder=&quot;0&quot; allow=&quot;accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share&quot; referrerpolicy=&quot;strict-origin-when-cross-origin&quot; allowfullscreen&gt;&lt;/iframe&gt;">&nbsp;</iframe></p><p>&nbsp;</p><img data-entity-uuid="157ac2ae-4de0-4485-8dc1-ee673ef8874f" data-entity-type="file" alt="Chancellor Sam Hawgood presents certificate to Pranay Narang" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-157_0.jpg.webp?itok=n8K7Nq5X" width="595" height="372"><p><strong>Pranay Narang, </strong>M.S., is a third-year medical student in the in the UC Berkeley–UCSF Joint Medical Program and UC Climate Action fellow. He helped develop a curriculum on climate-conscious clinical practices and approaches his research on health sustainability with a unique global and political perspective. Narang he has contributed to systemwide sustainability efforts focused on the environmental impact of healthcare delivery.</p><p>&nbsp;</p><img data-entity-uuid="467f150f-3197-4391-a1d8-28ca54bcbc3a" data-entity-type="file" alt="Sam Hawgood presents certificate to Laura Weill." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-156.jpg.webp?itok=Q-YBKHcy" width="599" height="374"><p><strong>Laura Weil,</strong> CNM, NP, MPH, is a nurse practitioner, midwife, and associate professor for Obstetrics and Gynecology &amp; Reproductive Services. She has stewarded numerous reforms to reduce waste in the Labor and Delivery unit, including switching to reusable gowns and improving protocols for catheter and blood pressure cuff use.</p><p>&nbsp;</p><p><img data-entity-uuid="e4c0f7dc-19bc-4d4f-aa91-86eb9c70a55f" data-entity-type="file" alt="Sam Hawgood presents certificate to Hilary Ong." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-155.jpg.webp?itok=NROjJWqi" width="601" height="376"></p><p><strong>Hilary Ong</strong>, MD, FAAP, DCM, is an assistant clinical professor of Pediatric Emergency Medicine. She is advancing healthcare sustainability through practical, data-driven improvements in emergency care. She reduced unnecessary waste by redesigning pediatric laceration kits and identified lower-emission options in inhaler prescribing without compromising patient care.&nbsp;</p><p>&nbsp;</p><p><img data-entity-uuid="64d55908-338c-4b29-9aa5-452c13982400" data-entity-type="file" alt="Sam Hawgood presents certificate to Matthew Richardson" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-158.jpg.webp?itok=Ef1FS6xR" width="603" height="377"><strong>Matthew Richardson</strong>, DPT, is the clinic supervisor for Outpatient Physical Therapy at UCSF Health Stanyan. As the Green Team lead at Stanyan, Richardson is a driving force behind sustainability and a consistent, trusted voice for change. Beyond his formal role, he has led impactful initiatives and brought teams together to embed sustainable practices across departments. His work reflects a deep commitment to improving both environmental outcomes and patient care. &nbsp;</p><p><img data-entity-uuid="33a36804-497b-4569-9ddc-801de97f7ee9" data-entity-type="file" alt="Sam Hawgood presents certificate to Christy Carillo" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-159.jpg.webp?itok=H6s90iaD" width="604" height="378"><br><strong>Christy Carillo</strong>, food services manager, has made significant advancements in reusable dining initiatives and reducing single-use waste to shift UCSF’s dining culture away from disposables. Her work at Mt. Zion has had a visible and measurable impact, helping to reduce waste while improving the dining experience for patients and employees.</p><p>&nbsp;</p><p><img data-entity-uuid="b735c117-217a-4642-8738-1e2120467bd1" data-entity-type="file" alt="Sam Hawgood presents certificate to Ramneek Rai" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-161.jpg.webp?itok=iDq6_BG3" width="597" height="373"><strong>Ramneek Rai</strong>, DDS, is the director of health and safety at the UCSF School of Dentistry. She has advanced sustainability by integrating environmentally responsible practices into clinical training and operations. Her leadership has improved waste management, reduced resource use, and strengthened safety across clinics, helping embed sustainability into everyday clinical practice.</p><p>&nbsp;</p><p><img data-entity-uuid="3c48c8bf-0812-4d3d-a406-d0723de12c99" data-entity-type="file" alt="Sam Hawgood presents certificate to Mel Maxwell" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-162.jpg.webp?itok=7H4M8N3b" width="588" height="368"><strong>Mel Maxwell</strong>,&nbsp;executive director of Supply Chain Management Logistics,&nbsp;has embedded sustainability into core operations by working to electrify Supply Chain Management’s 14-vehicle fleet. This work is particularly complex. Under his leadership, Logistics has begun building delivery operations that reduce reliance on fossil fuels and improve local air quality while maintaining reliable service.</p><p>&nbsp;</p><img data-entity-uuid="9ee65cfc-aa95-4776-831e-8bb79e20208d" data-entity-type="file" alt="Sam Hawgood presents certificate to the Bayfront team." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-163.jpg.webp?itok=CZxSSwPT" width="595" height="360"><p>Finally, UCSF recognized the <strong>UCSF Health Interdepartmental Team</strong> whose hard work and collaboration have been critical to the continued operation of the Bayfront Medical Building, UCSF’s fully all-electric, LEED gold-certified surgery center. These individuals from across Energy Management, Facilities&nbsp;Operations, and Real Estate worked diligently as a team to bring this project to fruition, ensuring that sustainability goals were not only built into the design but achieved in practice.</p><p>This team includes:&nbsp;</p><p>Gabe Sandoval, Senior Controls and Commissioning Engineer<br>Jacob Huth, Energy Engineer<br>Gabriel Mailland, Chief Engineer<br>Aaron Mackie, Assistant Chief Engineer<br>Wesley Burns, Assistant Chief Engineer<br>Branden Tran, Stationary Engineer<br>Chris Shirar, Senior Chief Engineer<br>Patrick McGee, Director of Major Capital Projects<br>Juliet Pahed, Senior Project Manager</p><h2 class="text-h3">Green Certificate Recipients</h2><img data-entity-uuid="d872ff7d-309e-4dc0-b421-98672491a537" data-entity-type="file" alt="Chancellor Hawgood with receipients of green certificates" data-image-style="full_size_width_1208" class="align-center image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-164.jpg.webp?itok=M2oQChyp" width="864" height="540"><p><strong>Green Unit Platinum</strong>​</p><p>PCMB Pharm Infusion Services&nbsp;<br>​<br><strong>Green Lab Gold</strong>​</p><p>Anatomy Learning Center, Yokoyama Lab and School of Dentistry Anatomy Lab&nbsp;<br>​<br><strong>Green Office Gold</strong></p><p>Tidelands Housing and Institute for Global Health Sciences and Department of Epidemiology and Biostatistics, including: Department of Family and Community Medicine, Bixby Center for Global Reproductive Health, Department of ObGyn, Curry International Tuberculosis Center (Department of Medicine), Division of Prevention Sciences (Department of Medicine).</p><h3>Waste to Art Winners</h3><figure role="group" class="caption caption-img align-center">
<img alt="Chancellor Hawgood poses with Waste to Art Winners" data-entity-type="file" data-entity-uuid="685bc75d-a00c-44e5-b1de-de04e74d1042" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-165.jpg.webp?itok=GmizNSCE" width="864" height="540" class="image-style-full-size-width-1208">
<figcaption>From left to right: Priyaka Suri, Leah Pimentel, Chancellor Hawgood, Lisa M. Thompson, Isabel Alves de Lima.&nbsp;</figcaption>
</figure>
<p><strong>1st place:</strong> <em>Birth and Rebirth: Black Maternal Mortality Explored Through the Quilting Tradition. </em>Created by: Isabel Alves de Lima with Leah Pimentel, MBA and Charlene Blake, MD</p><p><strong>2nd place</strong>: <em>Video: Ecolectivos art competition with women from Santa Maria Xalapán Jalapa, Guatemala. </em>Created by: Lisa M. Thompson, Professor, School of Nursing, UCSF. Video produced by Susana Aragon. Music de Anais Azul</p><p><strong>3rd place: </strong><em>MOUTH OF THE EARTH. </em>Created by: Priyanka Suri, UCSF School of Dentistry</p></div>

            <h2 class="node__title">
        <a href="/facilities/news/facilities-breaks-ground-new-child-care-canopy-project" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Facilities Breaks Ground on New Child Care Canopy Project </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10696" hreflang="en">FS_FAM Canopy installation drilling.JPG</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>This spring, Facilities is installing nine additional shade canopies at the University Child Care Center at Mission Bay.</p><p>When the child care was built in 2017, it included only a few umbrellas and shade canopies.&nbsp;</p><p>"During the hot, windy summers at Mission Bay, the playground often gets quite warm," Facilities Senior Project Manager, Ashley Hinton, said.</p><p>The new canopies, which range in size from 16 to to 20 feet, will be installed around the playground, providing ample shade over sand boxes, slides, and play equipment during warmer months.</p><p>The project is moving forward is occurring in three phases, and is set to be completed in July 2026.&nbsp;</p><figure role="group" class="caption caption-img">
<img alt="Children observe construction at Mission Bay" data-entity-type="file" data-entity-uuid="8e4e6ed7-e461-4faa-b949-99132052d50f" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Construction%20Observers.png.webp?itok=oz9nOjsZ" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>Children at the University Child Care Center observe the construction.</figcaption>
</figure>
<blockquote><p>"This is a robust project that involves drilling thirteen 9-foot deep holes in the play yard, infilling with rebar and concrete, and mounting custom-built steel canopies," Hinton said.</p></blockquote><img data-entity-uuid="b1cddbfc-b89e-41af-a921-9ee11e01541b" data-entity-type="file" alt="Bobcat E20 compact excavator." data-image-style="full_size_width_1208" class="align-left image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/image002%20%281%29_0.png.webp?itok=hUrn-8PA" width="430" height="452"><p>Hinton noted that teams from across Campus Life Services have come together to make this project happen.&nbsp;</p><p>"Facilities Projects led design, construction, and internal coordination. The child care center [run through Family Services] has been an integral partner throughout the design and installation process, and remains operational during construction. Trades, Engineering, and Grounds continue to provide problem solving and support."</p><p>Nathalie Larsen, Director of Family Services, is grateful for the installation, which began just in time for National Playground Safety Week.</p><p>"The additional shade structures on the playgrounds will provide important health, safety, and comfort benefits that support both active play and overall well-being. The canopies will help keep the playground equipment and surfaces cooler, making the space more usable during our warmer days at Mission Bay," Larsen said.&nbsp;</p><blockquote><p>"Beyond physical health, shade can create a more inviting and comfortable environment that encourages longer, more inclusive play, supporting social interaction, focus, and positive outdoor experiences," Larsen said.</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Existing Canopies at the child care center" data-entity-type="file" data-entity-uuid="755044d2-a56d-49a1-85d0-01d897ca90b3" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/IMG_1720_1.JPG.webp?itok=24F9WX7y" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>New canopies will add to the shade coverage of existing canopies (above).</figcaption>
</figure>
</div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Your search for professional business services begins and ends here. Engage with us for expertise in print and digital communications, building maintenance and resource conservation, and digital technologies to expand your program or department presence virtually or in person.&nbsp;</p></div>

  <div class="node__content clearfix">
    
            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><h2>Read all about it!</h2>

<p>A sampling of how we've been working to support the UCSF community</p></div>
      
  <div class="field field--name-field-embed-view field--type-viewsreference field--label-above">
    <div class="field__label">Embed view</div>
              <div class="field__item"><div class="views-element-container"><div class="view view-news view-id-news view-display-id-block_1 js-view-dom-id-1786098ce9953ef24a52b1cba0eaefb4ea4acf0c1ca64959c860867a64b79a08">

<article data-history-node-id="15721" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/sustainability/news/recap-ucsfs-vibrant-earth-month-activities" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">A Recap of UCSF&#039;s Vibrant Earth Month Activities</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10706" hreflang="en">SustAwards2026-153.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>This year UCSF celebrated Earth Day all month long. With lots of activities planned, from a<br>Sustainability Themed Bingo Card to an outdoor Yoga Flow Session, staff were encouraged<br>to participate in events that emphasized mindfulness and sustainability. Every Earth Month, the Sustainability Team is hard at work planning events for staff, students, and faculty alike.</p><h2 class="text-h3"><br>Here is a quick recap of the events:</h2><img data-entity-uuid="8fb486c9-c8fe-4245-adae-1f9aa13b34a1" data-entity-type="file" alt="Three people stand behind a table with informational materials and stickers" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Tabling.jpg.webp?itok=lcesXW7y" width="1208" height="1126" class="image-style-full-size-width-1208"><h3 class="text-h4"><br>1. Earth Week Tabling</h3><p>All week long, the UCSF Sustainability Team, along with partners from Recology and Stanyan’s Green Team, tabled across the five hospital sites: Mission Bay Medical Center, Parnassus Heights, Mount Zion Medical Center, and Hyde and Stanyan Hospitals. During these tabling sessions, the team provided waste sorting games, fun trivia questions, stickers, and more! The team had about 132 visitor engagements and got to answer any questions staff may have.</p><h3 class="text-h4"><br>2. Earth Month Bingo Card</h3><p>UCSF Health Sustainability Team made a Bingo Card that lasted all month long in honor of Earth Month. Some of the actions included “eat plant based for a day”, “reuse a single-use item”, or “take a screen break outside.” For a chance to win a sustainable prize, participants had to send in a completed bingo card as well as a picture of them completing one of the challenges. The<br>winners received a sustainable prize package, which included seeds, seed shakers,<br>and stasher bags. This challenge hopefully made staff more aware of sustainability<br>actions they can take in their everyday lives, making everyday Earth Day!</p><h3 class="text-h4"><img data-entity-uuid="475e5a15-3402-404b-9639-acd079efe53a" data-entity-type="file" alt="Sustainability team members stand next to the Waste to Art welcome banner." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/W2ADSC_0259.JPG.webp?itok=RbxKfzPq" width="1208" height="806" class="image-style-full-size-width-1208"></h3><h3 class="text-h4">3. Waste to Art Exhibition</h3><p>The Waste to Art Exhibition took place on April 14th and was a big success! Waste to Art is UCSF’s annual challenge dedicated to transforming waste, including medical and laboratory waste, into incredible, and inspiring art pieces. UCSF community members made an art piece of their choosing, and these pieces were showcased at the Waste to Art Exhibition. The beginning of the day was open to the public, where viewers surveyed the art and voted for their favorite pieces. Later in the day, from 3 to 4 p.m., followed a ceremony where the winners were announced and celebrated.</p><img data-entity-uuid="9d28d55c-4477-4906-bdb3-c721c7b5ef05" data-entity-type="file" alt="Two women stand in front of a quilted art piece" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0293%20%281%29.JPG.webp?itok=vuvXEjrT" width="1208" height="806" class="image-style-full-size-width-1208"><p>In first place was “Birth and Rebirth: Black Maternal Mortality Explored Through the Quilting Tradition” by Isabel Alves de Lima with Leah Pimentel, MBA and Charlene Blake, MD. They made a quilt constructed from medical textiles recovered from the Parnassus Operating room, including scrub caps, bunny suits, and disposable scrub jackets. The ‘Bricklayer’ quilt pattern is inspired by the Gee’s Bend quiltmakers, "a group of women and their ancestors from the Gee’s Bend area of Alabama’s rural Black Belt, whose quilts are celebrated as some of the most significant artistic contributions to American art history." An image of a birthing mother made of braided strips of material is shown, representing Black maternal mortality during childbirth.&nbsp;</p><img data-entity-uuid="17d95931-ab7f-42a3-a88b-49bba2418592" data-entity-type="file" alt="woman holds laptop and envelope with 2nd place ribbon" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0299.JPG.webp?itok=7l2QG16W" width="1208" height="860" class="image-style-full-size-width-1208"><p>In second place, was “<a href="https://www.youtube.com/watch?v=x3r_Z392WSo">Video</a>: Ecolectivos art competition with women from Santa Maria Xalapán, Jalapa, Guatemala” by Lisa M Thompson, Professor, School of Nursing, UCSF. This Waste to<br>Art video shows women who participated in a recycled plastic art contest. Thompsons’ team is also conducting a research project in rural Guatemala known as Ecolectivos, where they work with rural Xinca indigenous communities who are taking steps to reduce the burning of plastic waste in household cooking and trash fires, through encouraging repurposing plastic.&nbsp;</p><img data-entity-uuid="ad59cce3-b3d1-4b6c-b894-0049405d6e9b" data-entity-type="file" alt="Woman holds artwork shaped like a mouth with dental devices inside." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-175%20%281%29.jpg.webp?itok=J9pB6AoZ" width="1208" height="921" class="image-style-full-size-width-1208"><p>And in third place was, “Mouth of the Earth,” by Priyanka Suri, UCSF School of Dentistry Student. Mouth of the Earth confronts the often-unseen environmental cost of modern healthcare through the lens of dentistry. The sculpture is of the Earth, depicted as an open mouth,<br>representing our constant consumption and accumulation in nature. The sculpture<br>is constructed entirely from discarded dental materials, including blue nitrile gloves,<br>green rubber dam sheets, and layers of reclaimed boxing and beading wax molded<br>into exaggerated dentition. Mouth of the Earth is not only a reflection of current<br>realities, but also a call to action! Thank you to all our participants, winners, judges,<br>and sustainability team for putting this together!</p><img data-entity-uuid="4aa96321-c4c4-4ceb-8d38-3beb8553301b" data-entity-type="file" alt="Award recipients pose with Chancellor Hawgood" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-168%20%282%29.jpg.webp?itok=QywLFW9k" width="1208" height="755" class="image-style-full-size-width-1208"><h3 class="text-h4">4. UCSF Annual Sustainability Celebration</h3><p>The Annual Sustainability Awards Celebration took place on April 15th, honoring the hard work of notable UCSF community members’ contributions to sustainability efforts. We heard from key<br>speakers including Chief Sustainability Officer, Kira Stoll, and Chancellor, Sam Hawgood. Guests were served sustainable food from Moffit Catering Services on reusable dishware from Dispatch Goods, making it a zero-waste event. At the event, students, staff, and faculty sustainability advocates gathered to share community achievements and honor the 2026 UCSF Sustainability Award recipients in a recognition ceremony. The awardees are leading the way through unique efforts and impactful actions.&nbsp;</p><p>Congratulations to all sustainability award recipients: Pranay Narang, M.S. and Third-Year Medical Student; Laura Weil, CNM, NP, MPH; Hilary Ong, MD, FAAP, DCM; Matt Richardson, DPT; Ramneek Rai, DDS; Christy Carillo, CDM, CFPP; Mel Maxwell, Executive Director, Supply Chain Management – Logistics; and the UCSF Health Interdepartmental Team consisting of Energy Management, Facilities Operations, and Real Estate!</p><h3 class="text-h4"><br>5. Yoga Session</h3><p>UCSF Health Sustainability partnered with the Native American Health Alliance to hold a gentle yoga flow to celebrate Earth Month. It was led by Sapphire Persinger, a Clinical Research Coordinator at UCSF and certified yoga instructor. During the event, we set intentions of sustainability and mindfulness. The sustainability team was also tabling before and after the event, to inform staff on the importance of Earth Month and Sustainability.</p><h3 class="text-h4"><br>6. E-Waste</h3><p>UCSF Sustainability Teams held two e-waste events at Parnassus Heights<br>Hospital and Mission Bay Medical Center. Staff were onsite collecting unwanted electronics and had 25 participants at the Mission Bay Event and 58 participants at Parnassus Heights.</p><h3 class="text-h2 text-h4"><br>7. BCH Oakland Litter Pickup&nbsp;</h3><p>Members of the Oakland Green Team participated in a<br>litter cleanup on Friday, April 24th. For more information or any questions email: <a href="mailto:ucsfhealthsustainability@ucsf.edu">ucsfhealthsustainability@ucsf.edu</a></p></div>

<article data-history-node-id="15716" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/sustainability/news/ucsf-recognizes-2026-annual-sustainability-awards-recipients" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">UCSF Recognizes the 2026 Annual Sustainability Awards Recipients </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10701" hreflang="en">SustAwards2026-168 (1).jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Excitement was high as members of the UCSF community gathered for the Annual Sustainability Celebration hosted by the Office of Sustainability.</p><p>A focal point of the celebration is the Annual Sustainability Awards, sponsored by the UCSF Advisory Committee on Sustainability, which honor those who go above and beyond their role descriptions and take on the challenge of cleaning up the environment.</p><p>This year, UCSF recognized seven individuals and one team for making extraordinary contributions to sustainability across its campuses.</p><p>Chief Sustainability Officer Kira Stoll opened the event with reflections on the teams and individuals advancing sustainability across UCSF and highlighting how this work continues to expand across campuses, labs, and clinical care.</p><p>Chancellor Sam Hawgood, Sheila Antrum, RN MHSA, Senior Vice President and COO, UCSF Health and Erin Gore, Senior Vice Chancellor, Finance and Administration, were present to honor the awardee and spoke to the importance of their dedication to the environment.</p><blockquote><p><br>“What we see in today’s awardees is that climate action is not theoretical. It takes shape in very concrete ways. Reducing waste. Improving building performance. Rethinking prescribing practices. Advancing sustainable food systems. Transitioning to low-emissions transportation,” Hawgood said in his remarks. “Collectively, these efforts are helping to build a culture of sustainability at UCSF, one where environmental stewardship strengthens patient care, education, and operations.”</p></blockquote><img data-entity-uuid="2a00d971-7dde-4670-8fef-415cf2f71fa4" data-entity-type="file" alt="Chancellor Sam Hawgood speaks at a podium in front of a crowd." data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-116%20%281%29.jpg.webp?itok=6EHGaBn8" width="1208" height="755" class="image-style-full-size-width-1208"><blockquote><p><br>““Across our multiple sites, sustainability is becoming part of how we deliver care. It is reflected in how we manage resources and operate our clinical environments. It requires teams who are willing to rethink processes and coordinate across roles and disciplines to drive meaningful change,” Antrum said in her remarks.</p><p>&nbsp;</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Sheila Antrum gives her introduction to the awardees from behind a podium." data-entity-type="file" data-entity-uuid="cf68d015-a3f4-4f2d-9c1a-50ee44c38588" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-117.jpg.webp?itok=2xOJydxR" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Sheila Antrum introduces several awardees and shares her appreciation for their efforts.</figcaption>
</figure>
<p>Attendees got to try out reusable containers from Dispatch Goods, who is partnering with UCSF Nutrition and Food Services to bring more sustainable dining options to UCSF. Guests also had the opportunity to adopt native plants from Sutro Stewards, a volunteer organization who work alongside UCSF forestry technicians to take care of the Mount Sutro Open Space Reserve.</p><figure role="group" class="caption caption-img">
<img alt="Chancellor Sam Hawgood stands infront of artwork made of reused materials." data-entity-type="file" data-entity-uuid="43e87801-ea60-4305-89e6-ed0e20f95af5" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-132.jpg.webp?itok=ldeXcEs1" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Chancellor Sam Hawgood admires the submissions from this year's Waste to Art challenge.&nbsp;</figcaption>
</figure>
<p>In addition to the award recipients, the celebration honored all offices, labs, clinics/units, and event planners who have completed the <a href="https://campuslifeserviceshome.ucsf.edu/sustainability/sustainability-certifications">Sustainability Certification Program </a>and the winners of the<a href="https://campuslifeserviceshome.ucsf.edu/sustainability/waste-art"> 2026 Waste to Art challenge.</a>&nbsp;</p><p>The event captured a sense of inspiration and hope, as well as a renewed responsibility to consider how our daily work impacts the environment.&nbsp;</p><blockquote><p><br>“Sustainability is increasingly embedded in this work. It shapes how we design, operate, and manage our physical environment and administer programs. Advancing decarbonization at scale requires this kind of systems-level focus. It means improving building performance, reducing reliance on fossil fuels, and integrating sustainability into both long-term planning and project delivery,” Gore said in her remarks.</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Erin Gore shakes Mel Maxwell's hand in front of a podium. " data-entity-type="file" data-entity-uuid="d9882b45-3319-44af-9204-77d22875a64d" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-122.jpg.webp?itok=Cl-RzJT6" width="1208" height="755" class="image-style-full-size-width-1208">
<figcaption>Erin Gore congratulates Mel Maxwell on his Sustainability Award.</figcaption>
</figure>
<h2>Meet the Awardees</h2><p>▶ <strong>Watch the awardee highlights video.</strong>&nbsp;</p><p><iframe src="//www.youtube.com/embed/koNweSWG-M0?si=1Hrjx5VL-xUX3cI-&quot; title=&quot;YouTube video player&quot; frameborder=&quot;0&quot; allow=&quot;accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share&quot; referrerpolicy=&quot;strict-origin-when-cross-origin&quot; allowfullscreen&gt;&lt;/iframe&gt;">&nbsp;</iframe></p><p>&nbsp;</p><img data-entity-uuid="157ac2ae-4de0-4485-8dc1-ee673ef8874f" data-entity-type="file" alt="Chancellor Sam Hawgood presents certificate to Pranay Narang" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-157_0.jpg.webp?itok=n8K7Nq5X" width="595" height="372"><p><strong>Pranay Narang, </strong>M.S., is a third-year medical student in the in the UC Berkeley–UCSF Joint Medical Program and UC Climate Action fellow. He helped develop a curriculum on climate-conscious clinical practices and approaches his research on health sustainability with a unique global and political perspective. Narang he has contributed to systemwide sustainability efforts focused on the environmental impact of healthcare delivery.</p><p>&nbsp;</p><img data-entity-uuid="467f150f-3197-4391-a1d8-28ca54bcbc3a" data-entity-type="file" alt="Sam Hawgood presents certificate to Laura Weill." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-156.jpg.webp?itok=Q-YBKHcy" width="599" height="374"><p><strong>Laura Weil,</strong> CNM, NP, MPH, is a nurse practitioner, midwife, and associate professor for Obstetrics and Gynecology &amp; Reproductive Services. She has stewarded numerous reforms to reduce waste in the Labor and Delivery unit, including switching to reusable gowns and improving protocols for catheter and blood pressure cuff use.</p><p>&nbsp;</p><p><img data-entity-uuid="e4c0f7dc-19bc-4d4f-aa91-86eb9c70a55f" data-entity-type="file" alt="Sam Hawgood presents certificate to Hilary Ong." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-155.jpg.webp?itok=NROjJWqi" width="601" height="376"></p><p><strong>Hilary Ong</strong>, MD, FAAP, DCM, is an assistant clinical professor of Pediatric Emergency Medicine. She is advancing healthcare sustainability through practical, data-driven improvements in emergency care. She reduced unnecessary waste by redesigning pediatric laceration kits and identified lower-emission options in inhaler prescribing without compromising patient care.&nbsp;</p><p>&nbsp;</p><p><img data-entity-uuid="64d55908-338c-4b29-9aa5-452c13982400" data-entity-type="file" alt="Sam Hawgood presents certificate to Matthew Richardson" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-158.jpg.webp?itok=Ef1FS6xR" width="603" height="377"><strong>Matthew Richardson</strong>, DPT, is the clinic supervisor for Outpatient Physical Therapy at UCSF Health Stanyan. As the Green Team lead at Stanyan, Richardson is a driving force behind sustainability and a consistent, trusted voice for change. Beyond his formal role, he has led impactful initiatives and brought teams together to embed sustainable practices across departments. His work reflects a deep commitment to improving both environmental outcomes and patient care. &nbsp;</p><p><img data-entity-uuid="33a36804-497b-4569-9ddc-801de97f7ee9" data-entity-type="file" alt="Sam Hawgood presents certificate to Christy Carillo" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-159.jpg.webp?itok=H6s90iaD" width="604" height="378"><br><strong>Christy Carillo</strong>, food services manager, has made significant advancements in reusable dining initiatives and reducing single-use waste to shift UCSF’s dining culture away from disposables. Her work at Mt. Zion has had a visible and measurable impact, helping to reduce waste while improving the dining experience for patients and employees.</p><p>&nbsp;</p><p><img data-entity-uuid="b735c117-217a-4642-8738-1e2120467bd1" data-entity-type="file" alt="Sam Hawgood presents certificate to Ramneek Rai" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-161.jpg.webp?itok=iDq6_BG3" width="597" height="373"><strong>Ramneek Rai</strong>, DDS, is the director of health and safety at the UCSF School of Dentistry. She has advanced sustainability by integrating environmentally responsible practices into clinical training and operations. Her leadership has improved waste management, reduced resource use, and strengthened safety across clinics, helping embed sustainability into everyday clinical practice.</p><p>&nbsp;</p><p><img data-entity-uuid="3c48c8bf-0812-4d3d-a406-d0723de12c99" data-entity-type="file" alt="Sam Hawgood presents certificate to Mel Maxwell" data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-162.jpg.webp?itok=7H4M8N3b" width="588" height="368"><strong>Mel Maxwell</strong>,&nbsp;executive director of Supply Chain Management Logistics,&nbsp;has embedded sustainability into core operations by working to electrify Supply Chain Management’s 14-vehicle fleet. This work is particularly complex. Under his leadership, Logistics has begun building delivery operations that reduce reliance on fossil fuels and improve local air quality while maintaining reliable service.</p><p>&nbsp;</p><img data-entity-uuid="9ee65cfc-aa95-4776-831e-8bb79e20208d" data-entity-type="file" alt="Sam Hawgood presents certificate to the Bayfront team." data-image-style="full_size_width_1208" class="align-right image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-163.jpg.webp?itok=CZxSSwPT" width="595" height="360"><p>Finally, UCSF recognized the <strong>UCSF Health Interdepartmental Team</strong> whose hard work and collaboration have been critical to the continued operation of the Bayfront Medical Building, UCSF’s fully all-electric, LEED gold-certified surgery center. These individuals from across Energy Management, Facilities&nbsp;Operations, and Real Estate worked diligently as a team to bring this project to fruition, ensuring that sustainability goals were not only built into the design but achieved in practice.</p><p>This team includes:&nbsp;</p><p>Gabe Sandoval, Senior Controls and Commissioning Engineer<br>Jacob Huth, Energy Engineer<br>Gabriel Mailland, Chief Engineer<br>Aaron Mackie, Assistant Chief Engineer<br>Wesley Burns, Assistant Chief Engineer<br>Branden Tran, Stationary Engineer<br>Chris Shirar, Senior Chief Engineer<br>Patrick McGee, Director of Major Capital Projects<br>Juliet Pahed, Senior Project Manager</p><h2 class="text-h3">Green Certificate Recipients</h2><img data-entity-uuid="d872ff7d-309e-4dc0-b421-98672491a537" data-entity-type="file" alt="Chancellor Hawgood with receipients of green certificates" data-image-style="full_size_width_1208" class="align-center image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-164.jpg.webp?itok=M2oQChyp" width="864" height="540"><p><strong>Green Unit Platinum</strong>​</p><p>PCMB Pharm Infusion Services&nbsp;<br>​<br><strong>Green Lab Gold</strong>​</p><p>Anatomy Learning Center, Yokoyama Lab and School of Dentistry Anatomy Lab&nbsp;<br>​<br><strong>Green Office Gold</strong></p><p>Tidelands Housing and Institute for Global Health Sciences and Department of Epidemiology and Biostatistics, including: Department of Family and Community Medicine, Bixby Center for Global Reproductive Health, Department of ObGyn, Curry International Tuberculosis Center (Department of Medicine), Division of Prevention Sciences (Department of Medicine).</p><h3>Waste to Art Winners</h3><figure role="group" class="caption caption-img align-center">
<img alt="Chancellor Hawgood poses with Waste to Art Winners" data-entity-type="file" data-entity-uuid="685bc75d-a00c-44e5-b1de-de04e74d1042" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/SustAwards2026-165.jpg.webp?itok=GmizNSCE" width="864" height="540" class="image-style-full-size-width-1208">
<figcaption>From left to right: Priyaka Suri, Leah Pimentel, Chancellor Hawgood, Lisa M. Thompson, Isabel Alves de Lima.&nbsp;</figcaption>
</figure>
<p><strong>1st place:</strong> <em>Birth and Rebirth: Black Maternal Mortality Explored Through the Quilting Tradition. </em>Created by: Isabel Alves de Lima with Leah Pimentel, MBA and Charlene Blake, MD</p><p><strong>2nd place</strong>: <em>Video: Ecolectivos art competition with women from Santa Maria Xalapán Jalapa, Guatemala. </em>Created by: Lisa M. Thompson, Professor, School of Nursing, UCSF. Video produced by Susana Aragon. Music de Anais Azul</p><p><strong>3rd place: </strong><em>MOUTH OF THE EARTH. </em>Created by: Priyanka Suri, UCSF School of Dentistry</p></div>

            <h2 class="node__title">
        <a href="/facilities/news/facilities-breaks-ground-new-child-care-canopy-project" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Facilities Breaks Ground on New Child Care Canopy Project </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10696" hreflang="en">FS_FAM Canopy installation drilling.JPG</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>This spring, Facilities is installing nine additional shade canopies at the University Child Care Center at Mission Bay.</p><p>When the child care was built in 2017, it included only a few umbrellas and shade canopies.&nbsp;</p><p>"During the hot, windy summers at Mission Bay, the playground often gets quite warm," Facilities Senior Project Manager, Ashley Hinton, said.</p><p>The new canopies, which range in size from 16 to to 20 feet, will be installed around the playground, providing ample shade over sand boxes, slides, and play equipment during warmer months.</p><p>The project is moving forward is occurring in three phases, and is set to be completed in July 2026.&nbsp;</p><figure role="group" class="caption caption-img">
<img alt="Children observe construction at Mission Bay" data-entity-type="file" data-entity-uuid="8e4e6ed7-e461-4faa-b949-99132052d50f" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Construction%20Observers.png.webp?itok=oz9nOjsZ" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>Children at the University Child Care Center observe the construction.</figcaption>
</figure>
<blockquote><p>"This is a robust project that involves drilling thirteen 9-foot deep holes in the play yard, infilling with rebar and concrete, and mounting custom-built steel canopies," Hinton said.</p></blockquote><img data-entity-uuid="b1cddbfc-b89e-41af-a921-9ee11e01541b" data-entity-type="file" alt="Bobcat E20 compact excavator." data-image-style="full_size_width_1208" class="align-left image-style-full-size-width-1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/image002%20%281%29_0.png.webp?itok=hUrn-8PA" width="430" height="452"><p>Hinton noted that teams from across Campus Life Services have come together to make this project happen.&nbsp;</p><p>"Facilities Projects led design, construction, and internal coordination. The child care center [run through Family Services] has been an integral partner throughout the design and installation process, and remains operational during construction. Trades, Engineering, and Grounds continue to provide problem solving and support."</p><p>Nathalie Larsen, Director of Family Services, is grateful for the installation, which began just in time for National Playground Safety Week.</p><p>"The additional shade structures on the playgrounds will provide important health, safety, and comfort benefits that support both active play and overall well-being. The canopies will help keep the playground equipment and surfaces cooler, making the space more usable during our warmer days at Mission Bay," Larsen said.&nbsp;</p><blockquote><p>"Beyond physical health, shade can create a more inviting and comfortable environment that encourages longer, more inclusive play, supporting social interaction, focus, and positive outdoor experiences," Larsen said.</p></blockquote><figure role="group" class="caption caption-img">
<img alt="Existing Canopies at the child care center" data-entity-type="file" data-entity-uuid="755044d2-a56d-49a1-85d0-01d897ca90b3" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/IMG_1720_1.JPG.webp?itok=24F9WX7y" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>New canopies will add to the shade coverage of existing canopies (above).</figcaption>
</figure>
</div>

            <h2 class="node__title">
        <a href="/facilities/news/facilities-upgrades-essential-water-supply-parnassus-heights" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden"> Facilities Upgrades Essential Water Supply at Parnassus Heights</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10536" hreflang="en">FS stainless pipe.jpeg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Facilities recently closed out a Health Sciences Instruction and Research (HSIR) Deionized (DI) Water project by replacing aging PVC piping with more reliable stainless-steel lines and energy-efficient pumps to support critical water infrastructure at Parnassus Heights.&nbsp;</p><p>“This project improves system reliability and ensures continued, high-quality DI&nbsp;water&nbsp;service for our stakeholders at the Medical Sciences Building (MSB), HSIR, and the Medical Center.” Project Manager Darrick Lo said.</p><p>Deionized water is crucial in healthcare and research as it is a&nbsp;highly purified water that undergoes a process to remove minerals. At UCSF, it's used for laboratory research and the cleaning of surgical tools.&nbsp;</p><p>To ensure that there was no impact on the DI water, this project required careful phasing, with teams working around the older construction to build the new system in tandem.</p><p>“Our UCSF Operations team, alongside our contractors, did an exceptional job carefully planning each phase to ensure our DI tanks remain fully supplied. Thanks to their coordination and foresight, we maintained a reliable supply of DI water to support the campus community throughout the shutdown.” Lo said.</p><p>The installation also required rigorous attention to detail and cleanliness to prevent contamination of the deionized water.</p><figure role="group" class="caption caption-img">
<img alt="two pumps" data-entity-type="file" data-entity-uuid="84cbc0ff-91a1-40b6-a182-c0d809662ce4" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/new%20pumps_0.jpeg.webp?itok=vDgTHaUg" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>Energy-efficient pumps to support critical water infrastructure at Parnassus Heights.&nbsp;</figcaption>
</figure>
<p>“We ensured the new stainless-steel piping met all certification and compliance standards and conducted a thorough flushing process to verify the system was free of contaminants before filling it,” Lo said.</p><p>This effort was made possible through collaboration between Facilities, CBRI engineers, and plumbers.</p><blockquote><p>“We now have a system that can last long into the future, reliably supplying our researchers and health care providers. It’s been a pleasure to work with a dedicated team of managers, engineers, and trades workers who take pride in their work,” UCSF Facilities Lead Plumber Doug Bauer said.</p></blockquote><p>UCSF Assistant Chief Engineer&nbsp;Eric Zarco expressed gratitude to those involved in establishing a more efficient and reliable system.</p><figure role="group" class="caption caption-img">
<img alt="two tanks side by side" data-entity-type="file" data-entity-uuid="08d87e47-9233-46aa-94c2-205bd89bef3c" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/new%20controls%20to%20monitor%20tanks_0.jpeg.webp?itok=FCfXlijZ" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>The upgrades include new controls for monitoring.</figcaption>
</figure>
<p>“We are confident that the DI water system failures and downtime will be minimal going forward. With the addition of failure alarms and monitoring, any failure in the system will be quickly identified and responded to by our teams,” Zarco said.</p></div>

            <h2 class="node__title">
        <a href="/facilities/news/meet-oscar-ucsfs-new-ai-powered-solution-waste-sorting" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Meet Oscar: UCSF&#039;s New AI-Powered Solution for Waste Sorting</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10506" hreflang="en">FSOscarUnit.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>You may have noticed something unusual about the new waste sorting bins at UCSF.&nbsp;</p><p>His name is Oscar.&nbsp;</p><p>Oscar is a Smart Recycling Assistant from Intuitive AI, trained to help with waste bin sorting. All you need to do is hold the object (or objects, multiple can be done at a time) in front of Oscar, and Oscar will tell you which bin it goes into.</p><figure role="group" class="caption caption-img">
<img alt="Oscar wears sunglasses on the monitor screen above three waste bins." data-entity-type="file" data-entity-uuid="d38003d4-35fe-42a5-9be1-5335d6a7a50a" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/8E16C0EF-65E9-479A-A14B-F0A3EC0D4F17_2.JPG.webp?itok=vyEOZpgK" width="1208" height="861" class="image-style-full-size-width-1208">
<figcaption>You can find Oscar units at Mission Hall (above), Cole Hall, Genentech Hall, and Mission Union food court.</figcaption>
</figure>
<p>The Recycling and Waste team launched five Oscar bins at four locations across campus: two at Millberry Union food court, one in each of the lobbies at Genentech Hall, Cole Hall, and Mission Hall.&nbsp;</p><p>The goal is that the Oscar units will help people sort waste and improve UCSF’s overall waste diversion rate.</p><figure role="group" class="caption caption-img">
<img alt="Denny Nguyen, Landscape Supervisor holds a cup out in front of the Oscar unit." data-entity-type="file" data-entity-uuid="80abf88a-2316-4dce-8d6d-901981443be3" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0060.jpg.webp?itok=-PUSrG9T" width="1208" height="806" class="image-style-full-size-width-1208">
<figcaption>Denny Nguyen, Facilities Landscape Supervisor, tries out Oscar at the Second Annual Continuous Improvement Fair.</figcaption>
</figure>
<p>“UCSF has had a regression in our diversion rate since 2019...and it’s being attributed to a lot of improper sorting: people are just putting the wrong things in the wrong bin. That leads to excess fines, excess contamination fees, and excess charges we have to pay from our utilities bill,” Daniel Chau, Facilities Assistant Director of Recycling and Waste, said.&nbsp;</p><p>Chau thinks Oscar will be especially helpful for visitors or patients who may be less familiar with UCSF’s sorting protocols or face language barriers to understanding printed signage.&nbsp;</p><p>“At Millberry Union food court, patients are coming in and eating without being aware of what we are doing. We are hoping this is just one tool that can help emphasize the need for proper sorting,” Chau said.</p><figure role="group" class="caption caption-img">
<img alt="Chau holds a plastic based food container in front of Oscar" data-entity-type="file" data-entity-uuid="3a614877-6e13-41f7-891f-e22007894f60" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/DSC_0046_0.JPG.webp?itok=oG06INcX" width="1208" height="806" class="image-style-full-size-width-1208">
<figcaption>Chau demonstrates how Oscar units are programmed to recognize UCSF's unique waste-sorting guidelines.&nbsp;</figcaption>
</figure>
<p>The bins are tailored to UCSF’s specific recycling rules, providing helpful guidance to an otherwise confusing process, given that sorting protocols vary by county and state.</p><p>“People become more conscious when they approach a bin that prompts them to pause and think before throwing something away,” Brian Sano, Head of Strategy at Intuitive AI said.&nbsp;</p><blockquote><p>“It’s funny because many assume we’ve taken the thinking out of the process, but in reality, we’ve put the fun and thinking back into it,” Sano said.</p></blockquote><p>For those concerned about the environmental impact of AI, Sano assures that the AI used in the programming is sourced locally, making it more energy efficient.&nbsp;</p><p>“Something important to know is Oscar's AI runs on the edge, meaning its information is processed locally on the device,” he said. “That keeps data usage and energy consumption very low, and is comparable to a laptop and a TV.”</p><figure role="group" class="caption caption-img">
<img alt="Woman holds phone up to Oscar unit, screen says 'Scan here to win a surprise'" data-entity-type="file" data-entity-uuid="7ef8c3f3-60d5-4272-919b-3ef215b1bb80" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/77ED6B4C-FC1A-4FB1-B505-7F34186A1B4F.JPG.webp?itok=UvSURT2O" width="1208" height="906" class="image-style-full-size-width-1208">
<figcaption>Oscar units also engage visitors with interactive trivia and surpises.</figcaption>
</figure>
<p>You can also find Oscar in a number of locations around the Bay Area, including the California Academy of Sciences and the Salesforce Transit Center.</p><p>“We're launching Oscar in as many places around the Bay Area as possible,” he said. “There’s a concept known as the ‘rule of seven’. When people see or experience something repeatedly, they’re much more likely to adopt that behavior, especially when it's fun and rewarding.”</p><p>Chau’s team plans to compare audit data before and after the Oscar installations, with the hope of expanding to other campus locations in the near future.&nbsp;</p><p>So far, Chau says, the feedback has been positive.&nbsp;</p><blockquote><p>“From what I’ve seen from the people I’ve spoken to who have had these Oscar units placed, they’ve seen increases in participation and increases in proper sorting,” Chau said.</p></blockquote></div>

<article data-history-node-id="15606" class="node node--type-news node--promoted node--view-mode-default clearfix">
  <header>
    
            <h2 class="node__title">
        <a href="/transportation/news/survey-feedback-shuttle-service-how-lilac-route-was-created" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">From Survey Feedback to Shuttle Service: How the Lilac Route Was Created </span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10501" hreflang="en">TRN-lilac-boarding-MB.png</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><div><p>When UCSF Transportation reviewed more than 4,000 open-ended responses from the 2024 Commute Survey, one theme stood out: stronger connections to regional transit.&nbsp;</p></div><div><p>“We saw an interest in connections to BART and ferry service, and specific calls to connect to the San Francisco Ferry Building,” shared Transportation Demand Manager Tyler Dewey, who helps review survey feedback.&nbsp;</p></div><div><p>According to responses from both UCSF Health and Campus staff, commuting could become easier with smoother transfers and better coordination with regional systems.&nbsp;</p></div><div><h2>From Feedback to Route Design&nbsp;</h2></div><figure role="group" class="caption caption-img align-right">
<img alt="Tyler smiling" data-entity-type="file" data-entity-uuid="cc068424-c2d1-4a24-89de-66df880fab06" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Tyler%20Dewey.jpg.webp?itok=yGTnzC8J" width="200" height="300" class="image-style-full-size-width-1208">
<figcaption><em>Tyler Dewey, transportation demand manager</em></figcaption>
</figure>
<div><p>The transportation team analyzed survey comments through a combination of manual review and AI-supported sorting to identify clear patterns.&nbsp;</p></div><div><p>“That level of review allowed us to identify common themes,” Dewey said.&nbsp;</p></div><div><p>Once demand for stronger regional connections became clear, the team began designing what would become the <a href="https://campuslifeserviceshome.ucsf.edu/transportation/lilac-route-shuttle-schedule">Lilac Shuttle</a>.&nbsp;</p></div><div><p>Route development required careful planning — including service hours, frequency, stop locations, driver availability, and vehicle resources. Using transit planning software called Remix, the team modeled the future Lilac route alongside regional transit schedules to improve transfer coordination.&nbsp;</p></div><div><p>“Other regional transit agencies use the same software, which allows us to reference their timetables and design the smoothest transfers possible between public transit systems,” Dewey explained.&nbsp;</p></div><div><h2>A Growing Success&nbsp;</h2></div><div><dom-quote class="align--right size--half" data-color="blue"><div class="blockquote-content" slot="blockquote-content">“The Grey, Blue, and Gold shuttles are the backbone of the UCSF shuttle system, but the Lilac is quickly becoming a UCSF favorite.”</div><div class="blockquote-source" slot="blockquote-source">Tyler Dewey</div><div class="blockquote-source" slot="blockquote-source">Transportation Demand Manager</div></dom-quote><p>The Lilac is quickly becoming one of UCSF’s top-performing routes.&nbsp;</p></div><div><p>Ridership continues to increase, and our performance metrics are showing steady month-over-month improvement.&nbsp;</p></div><div><p>“The Grey, Blue, and Gold shuttles are the backbone of the UCSF shuttle system, but the Lilac is quickly becoming a UCSF favorite,” Dewey said.&nbsp;</p></div><div><p>The Lilac Shuttle didn’t start in a conference room. It started with feedback from the 2024 Commute Survey.&nbsp;</p></div><div><p>“This is not a survey that is put on the shelf,” Dewey said. “The more people who respond and the more honest the answers, the better we can craft commute programs that work for all of us at UCSF.”&nbsp;</p></div><div><p>The 2026 Commute Survey is open now through March 20, 2026. Share your input and help shape what comes next. <a href="https://dp.ucsf.edu/idp/profile/SAML2/Redirect/SSO?execution=e1s1">Take the survey.</a></p></div></div>
